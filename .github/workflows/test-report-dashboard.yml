name: Test Report Dashboard

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write

concurrency:
  group: test-report-dashboard-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  QT_QPA_PLATFORM: offscreen
  QTWEBENGINE_DISABLE_SANDBOX: "1"
  PYTHONUNBUFFERED: "1"
  ARTIFACT_REPO: ${{ github.repository_owner }}/private_artifact

jobs:
  tests:
    name: Tests (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-arm64
            label: Linux ARM64
            runner: '["self-hosted", "Linux", "ARM64"]'
          - platform: windows-x64
            label: Windows X64
            runner: '["self-hosted", "Windows", "X64"]'
    runs-on: ${{ fromJSON(matrix.runner) }}

    steps:
      - uses: actions/checkout@v6

      - name: Selected runner
        shell: bash
        if: runner.os != 'Windows'
        run: |
          echo "Runner labels: ${{ matrix.runner }}"
          echo "GitHub Actions will keep this job queued until a matching self-hosted runner is online."

      - name: Selected runner
        shell: powershell
        if: runner.os == 'Windows'
        run: |
          Write-Host "Runner labels: ${{ matrix.runner }}"
          Write-Host "GitHub Actions will keep this job queued until a matching self-hosted runner is online."

      - name: Ensure GitHub CLI
        shell: bash
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          release_json="$tmp_dir/gh-release.json"
          curl -fsSL "https://api.github.com/repos/cli/cli/releases/latest" -o "$release_json"
          gh_url="$(
            sed -nE 's/.*"browser_download_url": "(.*linux_arm64\.tar\.gz)".*/\1/p' "$release_json" \
              | head -n 1
          )"
          if [ -z "$gh_url" ]; then
            echo "Could not find GitHub CLI linux_arm64 download URL." >&2
            exit 1
          fi

          curl -fsSL "$gh_url" -o "$tmp_dir/gh.tar.gz"
          tar -xzf "$tmp_dir/gh.tar.gz" -C "$tmp_dir"
          gh_bin="$(find "$tmp_dir" -type f -path '*/bin/gh' | head -n 1)"
          if [ -z "$gh_bin" ]; then
            echo "gh binary not found after extraction." >&2
            exit 1
          fi

          install_dir="$RUNNER_TEMP/gh-cli/bin"
          mkdir -p "$install_dir"
          cp "$gh_bin" "$install_dir/gh"
          chmod +x "$install_dir/gh"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/gh" --version

      - name: Ensure GitHub CLI
        shell: powershell
        if: runner.os == 'Windows'
        run: |
          if (Get-Command gh -ErrorAction SilentlyContinue) {
            gh --version
            exit 0
          }

          $ErrorActionPreference = "Stop"
          $GhVersion = (Invoke-RestMethod "https://api.github.com/repos/cli/cli/releases/latest").tag_name.TrimStart('v')
          $GhZip = Join-Path $env:RUNNER_TEMP "gh_windows_amd64.zip"
          $GhDir = Join-Path $env:RUNNER_TEMP "gh-bin"
          Invoke-WebRequest -Uri "https://github.com/cli/cli/releases/download/v${GhVersion}/gh_${GhVersion}_windows_amd64.zip" -OutFile $GhZip
          Expand-Archive -Path $GhZip -DestinationPath $GhDir -Force
          $GhExe = Get-ChildItem -Path $GhDir -Filter "gh.exe" -Recurse | Select-Object -First 1
          if ($null -eq $GhExe) { throw "gh.exe not found after extraction in $GhDir" }
          Add-Content $env:GITHUB_PATH $GhExe.DirectoryName
          & $GhExe.FullName --version

      - uses: actions/setup-python@v6
        if: runner.os != 'Windows'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Select local Python on self-hosted Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $candidates = @(
            "python", "python3",
            "C:\Python313\python.exe", "C:\Python312\python.exe", "C:\Python311\python.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python313\python.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python312\python.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python311\python.exe",
            "C:\Program Files\Python313\python.exe",
            "C:\Program Files\Python312\python.exe",
            "C:\Program Files\Python311\python.exe"
          )
          $pyBin = $null
          foreach ($c in $candidates) {
            $bin = if ($c -notmatch '[\\/]') {
              $cmd = Get-Command $c -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($cmd) { $cmd.Source } else { $null }
            } elseif (Test-Path $c) { $c } else { $null }
            if (-not $bin) { continue }
            & $bin -c "import sys; raise SystemExit(0 if sys.version_info >= (3,11) else 1)" 2>$null
            if ($LASTEXITCODE -eq 0) { $pyBin = $bin; break }
          }
          if (-not $pyBin) {
            Write-Error "Python 3.11+ not found on the Windows self-hosted runner."
            exit 1
          }

          $venvDir = Join-Path $env:RUNNER_TEMP "face-local-test-venv"
          if (Test-Path $venvDir) { Remove-Item $venvDir -Recurse -Force }
          & $pyBin -m venv $venvDir
          if ($LASTEXITCODE -ne 0) { Write-Error "Failed to create Python virtual environment"; exit 1 }

          Add-Content $env:GITHUB_PATH (Join-Path $venvDir "Scripts")
          Add-Content $env:GITHUB_ENV "VIRTUAL_ENV=$venvDir"
          $venvPython = Join-Path $venvDir "Scripts\python.exe"
          & $venvPython --version
          & $venvPython -m pip --version
          if ($LASTEXITCODE -ne 0) { Write-Error "pip is not available in the Python virtual environment"; exit 1 }

      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          missing=()
          for pkg in \
            libegl1 \
            libgl1 \
            libopengl0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0; do
            dpkg -s "$pkg" >/dev/null 2>&1 || missing+=("$pkg")
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "Linux GUI libraries are already installed."
            exit 0
          fi

          if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          else
            echo "::warning::Missing Linux GUI packages: ${missing[*]}. Install them once on the self-hosted runner if Qt tests fail."
          fi

      - name: Install Python dependencies
        shell: bash
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev,gdrive,tflite]"

      - name: Install Python dependencies
        shell: powershell
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev,gdrive,tflite]"

      - name: Run test suite
        id: tests
        shell: bash
        if: runner.os != 'Windows'
        run: |
          set +e
          TEST_REPORT_DIR="test-reports/${{ matrix.platform }}" scripts/run_tests.sh
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run test suite
        id: tests_windows
        shell: powershell
        if: runner.os == 'Windows'
        run: |
          $env:TEST_REPORT_DIR = "test-reports\${{ matrix.platform }}"
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\run_tests.ps1
          $status = $LASTEXITCODE
          "exit_code=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          exit 0

      - name: Package test report bundle
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          report_dir="test-reports/${{ matrix.platform }}"
          mkdir -p "$report_dir"
          [ -f "$report_dir/latest.md" ] || printf '# Test Report\n\nThe pytest report was not generated.\n' > "$report_dir/latest.md"
          [ -f "$report_dir/latest.log" ] || printf 'The pytest log was not generated.\n' > "$report_dir/latest.log"
          [ -f "$report_dir/latest.junit.xml" ] || printf '<testsuites tests="0" failures="0" errors="0" skipped="0"></testsuites>\n' > "$report_dir/latest.junit.xml"
          python - <<'PY'
          from pathlib import Path
          import zipfile

          platform = "${{ matrix.platform }}"
          report_dir = Path("test-reports") / platform
          bundle = report_dir / "test-report-bundle.zip"
          with zipfile.ZipFile(bundle, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for name in ("latest.md", "latest.log", "latest.junit.xml"):
                  zf.write(report_dir / name, name)
          PY

      - name: Package test report bundle
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: |
          $reportDir = "test-reports\${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path $reportDir | Out-Null
          $latestMd = Join-Path $reportDir "latest.md"
          $latestLog = Join-Path $reportDir "latest.log"
          $latestXml = Join-Path $reportDir "latest.junit.xml"
          if (-not (Test-Path $latestMd)) { "# Test Report`n`nThe pytest report was not generated." | Out-File -Encoding utf8 $latestMd }
          if (-not (Test-Path $latestLog)) { "The pytest log was not generated." | Out-File -Encoding utf8 $latestLog }
          if (-not (Test-Path $latestXml)) { '<testsuites tests="0" failures="0" errors="0" skipped="0"></testsuites>' | Out-File -Encoding utf8 $latestXml }
          python -c "from pathlib import Path; import zipfile; report_dir=Path('test-reports')/'${{ matrix.platform }}'; bundle=report_dir/'test-report-bundle.zip'; zf=zipfile.ZipFile(bundle,'w',compression=zipfile.ZIP_DEFLATED); [zf.write(report_dir/name,name) for name in ('latest.md','latest.log','latest.junit.xml')]; zf.close()"

      - name: Upload test report artifact
        id: upload_test_report
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.platform }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            test-reports/${{ matrix.platform }}/latest.md
            test-reports/${{ matrix.platform }}/latest.log
            test-reports/${{ matrix.platform }}/latest.junit.xml
            test-reports/${{ matrix.platform }}/test-report-bundle.zip
          if-no-files-found: warn

      - name: Fallback upload test report to private artifact repo
        if: always() && runner.os != 'Windows' && steps.upload_test_report.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_ARTIFACT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "PRIVATE_ARTIFACT_TOKEN is empty; cannot use private artifact fallback." >&2
            exit 1
          fi
          bundle="test-reports/${{ matrix.platform }}/test-report-bundle.zip"
          if [ ! -f "$bundle" ]; then
            echo "Fallback bundle not found: $bundle" >&2
            exit 1
          fi

          tag="artifact-tests-${{ matrix.platform }}-${{ github.run_number }}-${{ github.run_attempt }}"
          if ! gh release view "$tag" --repo "${{ env.ARTIFACT_REPO }}" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "${{ env.ARTIFACT_REPO }}" \
              --title "Test report artifact ${{ matrix.label }} run ${{ github.run_number }}.${{ github.run_attempt }}" \
              --notes "Test report artifact fallback for ${{ github.repository }} ${{ matrix.label }} run ${{ github.run_number }} attempt ${{ github.run_attempt }}." \
              --prerelease \
              || gh release view "$tag" --repo "${{ env.ARTIFACT_REPO }}" >/dev/null
          fi

          gh release upload "$tag" "$bundle" \
            --repo "${{ env.ARTIFACT_REPO }}" \
            --clobber

      - name: Fallback upload test report to private artifact repo
        if: always() && runner.os == 'Windows' && steps.upload_test_report.outcome == 'failure'
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_ARTIFACT_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { throw "PRIVATE_ARTIFACT_TOKEN is empty; cannot use private artifact fallback." }
          $bundle = "test-reports\${{ matrix.platform }}\test-report-bundle.zip"
          if (-not (Test-Path $bundle)) { throw "Fallback bundle not found: $bundle" }

          $Tag = "artifact-tests-${{ matrix.platform }}-${{ github.run_number }}-${{ github.run_attempt }}"

          $ErrorActionPreference = "SilentlyContinue"
          $null = gh release view $Tag --repo "${{ env.ARTIFACT_REPO }}" 2>&1
          $releaseExists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = "Stop"

          if (-not $releaseExists) {
            gh release create $Tag `
              --repo "${{ env.ARTIFACT_REPO }}" `
              --title "Test report artifact ${{ matrix.label }} run ${{ github.run_number }}.${{ github.run_attempt }}" `
              --notes "Test report artifact fallback for ${{ github.repository }} ${{ matrix.label }} run ${{ github.run_number }} attempt ${{ github.run_attempt }}." `
              --prerelease
            if ($LASTEXITCODE -ne 0) {
              gh release view $Tag --repo "${{ env.ARTIFACT_REPO }}"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

          gh release upload $Tag $bundle `
            --repo "${{ env.ARTIFACT_REPO }}" `
            --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Add report links to job summary
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          {
            echo "## Test report (${{ matrix.label }})"
            echo ""
            echo "- Local report path in artifact: test-reports/${{ matrix.platform }}/latest.md"
            echo "- Artifact fallback release tag: artifact-tests-${{ matrix.platform }}-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "- Test exit code: ${{ steps.tests.outputs.exit_code }}${{ steps.tests_windows.outputs.exit_code }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Add report links to job summary
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: |
          @(
            "## Test report (${{ matrix.label }})",
            "",
            "- Local report path in artifact: test-reports/${{ matrix.platform }}/latest.md",
            "- Artifact fallback release tag: artifact-tests-${{ matrix.platform }}-${{ github.run_number }}-${{ github.run_attempt }}",
            "- Test exit code: ${{ steps.tests.outputs.exit_code }}${{ steps.tests_windows.outputs.exit_code }}"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Fail job if tests failed
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          status="${{ steps.tests.outputs.exit_code }}${{ steps.tests_windows.outputs.exit_code }}"
          if [ -z "$status" ]; then
            echo "Test step did not report an exit code."
            exit 1
          fi
          exit "$status"

      - name: Fail job if tests failed
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: |
          $status = "${{ steps.tests.outputs.exit_code }}${{ steps.tests_windows.outputs.exit_code }}"
          if (-not $status) {
            Write-Error "Test step did not report an exit code."
            exit 1
          }
          exit ([int]$status)

  publish-dashboard:
    name: Publish Dashboard
    needs: tests
    if: always() && github.event_name != 'pull_request'
    runs-on:
      - self-hosted
      - Linux
      - ARM64

    steps:
      - uses: actions/checkout@v6

      - name: Ensure GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          echo "gh CLI not found. Install GitHub CLI on this self-hosted Linux runner." >&2
          exit 1

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore dashboard history
        shell: bash
        run: |
          mkdir -p test-reports/site
          git fetch origin gh-pages --depth=1 || true
          git show origin/gh-pages:history.json > test-reports/site/history.json 2>/dev/null || true

      - name: Download Linux report artifact
        id: download_linux
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: test-report-linux-arm64-${{ github.run_number }}-${{ github.run_attempt }}
          path: downloaded-reports/linux-arm64

      - name: Fallback download Linux report from private artifact repo
        if: steps.download_linux.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_ARTIFACT_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p downloaded-reports/linux-arm64
          gh release download "artifact-tests-linux-arm64-${{ github.run_number }}-${{ github.run_attempt }}" \
            --repo "${{ env.ARTIFACT_REPO }}" \
            --pattern "test-report-bundle.zip" \
            --dir downloaded-reports/linux-arm64
          python - <<'PY'
          from pathlib import Path
          import zipfile
          target = Path("downloaded-reports/linux-arm64")
          with zipfile.ZipFile(target / "test-report-bundle.zip") as zf:
              zf.extractall(target)
          PY

      - name: Download Windows report artifact
        id: download_windows
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: test-report-windows-x64-${{ github.run_number }}-${{ github.run_attempt }}
          path: downloaded-reports/windows-x64

      - name: Fallback download Windows report from private artifact repo
        if: steps.download_windows.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_ARTIFACT_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p downloaded-reports/windows-x64
          gh release download "artifact-tests-windows-x64-${{ github.run_number }}-${{ github.run_attempt }}" \
            --repo "${{ env.ARTIFACT_REPO }}" \
            --pattern "test-report-bundle.zip" \
            --dir downloaded-reports/windows-x64
          python - <<'PY'
          from pathlib import Path
          import zipfile
          target = Path("downloaded-reports/windows-x64")
          with zipfile.ZipFile(target / "test-report-bundle.zip") as zf:
              zf.extractall(target)
          PY

      - name: Generate dashboard site
        shell: bash
        run: |
          set -euo pipefail
          if [ -f downloaded-reports/linux-arm64/latest.md ]; then
            python scripts/generate_test_dashboard.py \
              --report-dir downloaded-reports/linux-arm64 \
              --site-dir test-reports/site \
              --platform "Linux ARM64"
          fi
          if [ -f downloaded-reports/windows-x64/latest.md ]; then
            python scripts/generate_test_dashboard.py \
              --report-dir downloaded-reports/windows-x64 \
              --site-dir test-reports/site \
              --platform "Windows X64"
          fi

      - name: Upload dashboard artifact
        id: upload_dashboard
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-dashboard-${{ github.run_number }}-${{ github.run_attempt }}
          path: test-reports/site/**
          if-no-files-found: warn

      - name: Fallback upload dashboard to private artifact repo
        if: steps.upload_dashboard.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_ARTIFACT_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile
          site = Path("test-reports/site")
          with zipfile.ZipFile("test-reports/test-dashboard-site.zip", "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in site.rglob("*"):
                  if path.is_file():
                      zf.write(path, path.relative_to(site))
          PY
          tag="artifact-tests-dashboard-${{ github.run_number }}-${{ github.run_attempt }}"
          if ! gh release view "$tag" --repo "${{ env.ARTIFACT_REPO }}" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "${{ env.ARTIFACT_REPO }}" \
              --title "Test dashboard artifact run ${{ github.run_number }}.${{ github.run_attempt }}" \
              --notes "Dashboard artifact fallback for ${{ github.repository }} run ${{ github.run_number }} attempt ${{ github.run_attempt }}." \
              --prerelease \
              || gh release view "$tag" --repo "${{ env.ARTIFACT_REPO }}" >/dev/null
          fi
          gh release upload "$tag" test-reports/test-dashboard-site.zip \
            --repo "${{ env.ARTIFACT_REPO }}" \
            --clobber

      - name: Publish GitHub Pages dashboard
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          publish_dir="$RUNNER_TEMP/test-dashboard-pages"
          rm -rf "$publish_dir"
          mkdir -p "$publish_dir"
          cp -R test-reports/site/. "$publish_dir"

          cd "$publish_dir"
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add .
          git commit -m "Update test dashboard for run ${GITHUB_RUN_NUMBER}" || exit 0
          git push --force origin gh-pages

      - name: Configure GitHub Pages branch source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          page_payload='{"source":{"branch":"gh-pages","path":"/"}}'

          echo "$page_payload" | gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/pages" \
            --input -
          status=$?

          if [ "$status" -ne 0 ]; then
            echo "$page_payload" | gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/pages" \
              --input -
            status=$?
          fi

          if [ "$status" -ne 0 ]; then
            echo "::warning::Could not configure GitHub Pages automatically. In repository settings, set Pages source to branch 'gh-pages' and folder '/'."
          fi

      - name: Add dashboard link to job summary
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          pages_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repo_name}/"
          {
            echo "## Test dashboard"
            echo ""
            echo "- Dashboard: ${pages_url}"
            echo "- Linux fallback tag: artifact-tests-linux-arm64-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "- Windows fallback tag: artifact-tests-windows-x64-${{ github.run_number }}-${{ github.run_attempt }}"
          } >> "$GITHUB_STEP_SUMMARY"
