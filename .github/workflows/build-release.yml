name: Build And Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: "false"

permissions:
  contents: write
  actions: read
  issues: read
  repository-projects: write

env:
  PYTHON_VERSION: "3.11"
  APP_NAME: Face-Local
  OWNER: ${{ github.repository_owner }}
  ARTIFACT_REPO: ${{ github.repository_owner }}/private_artifact
  # Sparkle 2 — pin the version for reproducible builds.
  # Update this variable and rotate SPARKLE_PUBLIC_KEY / SPARKLE_PRIVATE_KEY
  # whenever upgrading Sparkle.
  SPARKLE_VERSION: "2.6.4"

jobs:
  pick-runner:
    name: Pick build runner
    runs-on:
      - self-hosted
      - Linux
      - ARM64
    outputs:
      mac_runner: ${{ steps.pick_mac.outputs.runner }}
      mac_runner_note: ${{ steps.pick_mac.outputs.runner_note }}
      windows_runner: ${{ steps.pick_windows.outputs.runner }}
      windows_runner_note: ${{ steps.pick_windows.outputs.runner_note }}
    steps:
      - name: Pick macOS runner
        id: pick_mac
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          RUNNER_NAME: Koncsik-MacBook-Air
        shell: bash
        run: |
          PYTHON_BIN="$(command -v python3 || command -v python || true)"
          STATUS=""
          if [ -n "$PYTHON_BIN" ]; then
            STATUS=$("$PYTHON_BIN" - <<'PY' 2>/dev/null || true
          import json
          import os
          import urllib.request

          token = os.environ.get("GH_TOKEN", "")
          if not token:
              raise SystemExit(0)

          request = urllib.request.Request(
              f"https://api.github.com/orgs/{os.environ['OWNER']}/actions/runners",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)

          for runner in payload.get("runners", []):
              if runner.get("name") == os.environ["RUNNER_NAME"]:
                  print(runner.get("status", ""))
                  break
          PY
            )
          fi

          if [ "$STATUS" = "online" ]; then
            echo 'runner=["self-hosted", "macOS", "ARM64"]' >> "$GITHUB_OUTPUT"
            echo 'runner_note=Runner: Koncsik-MacBook-Air (online)' >> "$GITHUB_OUTPUT"
          else
            echo 'runner=["macos-latest"]' >> "$GITHUB_OUTPUT"
            echo 'runner_note=Runner: macos-latest (fallback)' >> "$GITHUB_OUTPUT"
          fi

      - name: Pick Windows runner
        id: pick_windows
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          RUNNER_NAME: nagy_gep_windows
        shell: bash
        run: |
          PYTHON_BIN="$(command -v python3 || command -v python || true)"
          STATUS=""
          if [ -n "$PYTHON_BIN" ]; then
            STATUS=$("$PYTHON_BIN" - <<'PY' 2>/dev/null || true
          import json
          import os
          import urllib.request

          token = os.environ.get("GH_TOKEN", "")
          if not token:
              raise SystemExit(0)

          request = urllib.request.Request(
              f"https://api.github.com/orgs/{os.environ['OWNER']}/actions/runners",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)

          for runner in payload.get("runners", []):
              if runner.get("name") == os.environ["RUNNER_NAME"]:
                  print(runner.get("status", ""))
                  break
          PY
            )
          fi

          if [ "$STATUS" = "online" ]; then
            echo 'runner=["self-hosted", "Windows", "X64"]' >> "$GITHUB_OUTPUT"
            echo 'runner_note=Runner: nagy_gep_windows (online)' >> "$GITHUB_OUTPUT"
          else
            echo 'runner=["windows-latest"]' >> "$GITHUB_OUTPUT"
            echo 'runner_note=Runner: windows-latest (fallback)' >> "$GITHUB_OUTPUT"
          fi

  prepare:
    runs-on:
      - self-hosted
      - Linux
      - ARM64
    outputs:
      base_version: ${{ steps.meta.outputs.base_version }}
      package_version: ${{ steps.meta.outputs.package_version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - id: meta
        shell: bash
        run: |
          git fetch --tags --force
          export BASE_VERSION="$(python - <<'PY'
          import os
          import re
          import subprocess
          import tomllib

          with open("pyproject.toml", "rb") as fh:
              configured = tomllib.load(fh)["project"]["version"]

          match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", configured)
          if not match:
              raise SystemExit(f"pyproject version must be semver x.y.z, got: {configured}")

          major, minor, patch_floor = map(int, match.groups())
          prefix = f"v{major}.{minor}."
          tags = subprocess.check_output(["git", "tag", "--list", f"{prefix}*"], text=True).splitlines()

          patch_numbers = []
          for tag in tags:
              tag_match = re.fullmatch(rf"v{major}\.{minor}\.(\d+)", tag.strip())
              if tag_match:
                  patch_numbers.append(int(tag_match.group(1)))

          next_patch = patch_floor if not patch_numbers else max(max(patch_numbers) + 1, patch_floor)
          print(f"{major}.{minor}.{next_patch}")
          PY
          )"
          PACKAGE_VERSION="$BASE_VERSION"
          TAG="v${PACKAGE_VERSION}"
          RELEASE_NAME="Face-Local v${PACKAGE_VERSION}"

          {
            echo "base_version=$BASE_VERSION"
            echo "package_version=$PACKAGE_VERSION"
            echo "tag=$TAG"
            echo "release_name=$RELEASE_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Move referenced issues to Commitolt
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.APPCAST_PUSH_TOKEN }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          PROJECT_TITLE: Local AI Face Recognizer
          PROJECT_STATUS_FIELD: Status
          PROJECT_TARGET_OPTION: Commitolt
          PROJECT_ISSUE_MOVE_BEST_EFFORT: "true"
        shell: bash
        run: python3 .github/scripts/move_project_issues_ready.py

  build-macos:
    needs:
      - prepare
      - pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.mac_runner) }}
    steps:
      - uses: actions/checkout@v6

      - name: Selected macOS runner
        shell: bash
        run: echo "${{ needs.pick-runner.outputs.mac_runner_note }}"

      - name: Prepare writable Python tool cache
        if: ${{ !contains(needs.pick-runner.outputs.mac_runner, 'self-hosted') }}
        shell: bash
        run: |
          TOOLCACHE="${RUNNER_TEMP}/hostedtoolcache"
          mkdir -p "$TOOLCACHE"
          echo "AGENT_TOOLSDIRECTORY=$TOOLCACHE" >> "$GITHUB_ENV"
          echo "RUNNER_TOOL_CACHE=$TOOLCACHE" >> "$GITHUB_ENV"

      - name: Select local Python on self-hosted macOS
        if: ${{ contains(needs.pick-runner.outputs.mac_runner, 'self-hosted') }}
        shell: bash
        run: |
          find_python() {
            for candidate in python3.13 python3.12 python3.11 python3 python; do
              local bin
              bin="$(command -v "$candidate" 2>/dev/null)" || continue
              if "$bin" - <<'PY' >/dev/null 2>&1
          import sys
          raise SystemExit(0 if sys.version_info >= (3, 11) else 1)
          PY
              then
                echo "$bin"
                return 0
              fi
            done
            # also check well-known Homebrew locations not always on PATH
            for candidate in \
              /opt/homebrew/bin/python3.13 \
              /opt/homebrew/bin/python3.12 \
              /opt/homebrew/bin/python3.11 \
              /usr/local/bin/python3.13 \
              /usr/local/bin/python3.12 \
              /usr/local/bin/python3.11; do
              [ -x "$candidate" ] || continue
              if "$candidate" - <<'PY' >/dev/null 2>&1
          import sys
          raise SystemExit(0 if sys.version_info >= (3, 11) else 1)
          PY
              then
                echo "$candidate"
                return 0
              fi
            done
            return 1
          }

          PY_BIN="$(find_python)" || {
            echo "Python 3.11+ not found — installing via Homebrew..." >&2
            brew install python@3.11 >&2
            PY_BIN="$(find_python)" || {
              echo "Python 3.11+ was not found even after Homebrew install." >&2
              exit 1
            }
          }

          VENV_DIR="${RUNNER_TEMP}/venv"
          "$PY_BIN" -m venv "$VENV_DIR"
          echo "$VENV_DIR/bin" >> "$GITHUB_PATH"
          echo "MACOS_PYTHON_BIN=$PY_BIN" >> "$GITHUB_ENV"
          "$PY_BIN" --version

      - uses: actions/setup-python@v6
        if: ${{ !contains(needs.pick-runner.outputs.mac_runner, 'self-hosted') }}
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install . pyinstaller

      - name: Download embedding models
        shell: bash
        run: |
          mkdir -p models
          if [ ! -f models/mobilefacenet.tflite ]; then
            mirrors=(
              "https://github.com/MCarlomagno/FaceRecognitionAuth/raw/refs/heads/master/assets/mobilefacenet.tflite"
              "https://github.com/pb-julian/liteface/raw/main/tflite_models/mobilefacenet.tflite"
            )
            for url in "${mirrors[@]}"; do
              if curl -fsSL --retry 3 -o models/mobilefacenet.tflite "$url"; then
                echo "Downloaded mobilefacenet.tflite from $url"
                break
              fi
            done
            [ -f models/mobilefacenet.tflite ] || { echo "ERROR: Failed to download mobilefacenet.tflite"; exit 1; }
          fi
          if [ ! -f models/face_recognition_sface_2021dec.onnx ]; then
            curl -fsSL --retry 3 \
              -o models/face_recognition_sface_2021dec.onnx \
              "https://github.com/opencv/opencv_zoo/raw/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx" \
              || echo "WARNING: SFace model download failed (non-fatal)"
          fi

      - name: Build bundled app
        shell: bash
        run: python scripts/package_app.py --version "${{ needs.prepare.outputs.package_version }}"

      # ──────────────────────────────────────────────────────────────────────
      # Sparkle 2 integration
      # ──────────────────────────────────────────────────────────────────────

      - name: Download Sparkle distribution
        shell: bash
        run: |
          set -euo pipefail
          DIST_DIR="${RUNNER_TEMP}/sparkle-dist"
          mkdir -p "$DIST_DIR"
          URL="https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          echo "Downloading Sparkle ${SPARKLE_VERSION} from $URL"
          curl -fsSL --retry 3 "$URL" | tar -xJ -C "$DIST_DIR"
          echo "SPARKLE_DIST=$DIST_DIR" >> "$GITHUB_ENV"
          ls -la "$DIST_DIR"

      - name: Compile SparkleHelper
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v swiftc >/dev/null 2>&1; then
            echo "::error::swiftc not found — Xcode must be installed on the macOS runner"
            exit 1
          fi
          ARCH="$(uname -m)"
          TARGET="${ARCH}-apple-macos12.0"
          echo "Compiling SparkleHelper for $TARGET"
          swiftc \
            -O \
            -target "$TARGET" \
            -F "$SPARKLE_DIST" \
            -framework Sparkle \
            -o "dist/SparkleHelper" \
            sparkle/Sources/SparkleHelper/main.swift
          file dist/SparkleHelper

      - name: Bundle Sparkle framework and helper into app
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/Face-Local.app"
          mkdir -p "$APP/Contents/Frameworks"

          # Replace or copy Sparkle.framework
          rm -rf "$APP/Contents/Frameworks/Sparkle.framework"
          cp -R "$SPARKLE_DIST/Sparkle.framework" "$APP/Contents/Frameworks/"

          # Install SparkleHelper binary
          cp "dist/SparkleHelper" "$APP/Contents/MacOS/SparkleHelper"
          chmod +x "$APP/Contents/MacOS/SparkleHelper"

          echo "Bundle contents:"
          ls -la "$APP/Contents/Frameworks/"
          ls -la "$APP/Contents/MacOS/"

      - name: Patch Info.plist with version and Sparkle keys
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        run: |
          APPCAST_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/docs/appcast.xml"
          export APPCAST_URL
          python3 - <<'PY'
          import plistlib, os, sys
          from pathlib import Path
          from datetime import datetime

          plist_path = Path("dist/Face-Local.app/Contents/Info.plist")
          if not plist_path.exists():
              print(f"ERROR: {plist_path} not found", file=sys.stderr)
              sys.exit(1)

          with open(plist_path, "rb") as fh:
              plist = plistlib.load(fh)

          version      = os.environ["PACKAGE_VERSION"]
          su_key       = os.environ.get("SPARKLE_PUBLIC_KEY", "")
          appcast_url  = os.environ.get("APPCAST_URL", "")

          plist["CFBundleShortVersionString"] = version
          plist["CFBundleVersion"]            = version
          plist["NSHumanReadableCopyright"]   = f"Copyright © {datetime.now().year} Face-Local"
          plist["NSHighResolutionCapable"]    = True

          if su_key:
              plist["SUPublicEDKey"] = su_key
              print(f"  SUPublicEDKey: {su_key[:24]}...")
          else:
              print("  WARNING: SPARKLE_PUBLIC_KEY not set — update checking disabled in this build")
          if appcast_url:
              plist["SUFeedURL"] = appcast_url
              print(f"  SUFeedURL: {appcast_url}")

          with open(plist_path, "wb") as fh:
              plistlib.dump(plist, fh)
          print(f"Info.plist patched (version={version})")
          PY

      # ──────────────────────────────────────────────────────────────────────
      # Code signing — conditional on DEVELOPER_ID_CERT_P12 secret
      # ──────────────────────────────────────────────────────────────────────

      - name: Setup keychain and import Developer ID certificate
        if: ${{ env.CERT_P12 != '' }}
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="${RUNNER_TEMP}/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain  -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_PATH"

          CERT_FILE="${RUNNER_TEMP}/developer_id.p12"
          echo "$CERT_P12" | base64 --decode > "$CERT_FILE"
          security import "$CERT_FILE" -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT_FILE"

          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::Developer ID Application certificate not found in keychain"
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signing identity resolved: $IDENTITY"

      - name: Sign macOS app bundle
        if: ${{ env.SIGN_IDENTITY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/Face-Local.app"
          ENTITLEMENTS="assets/entitlements.plist"
          echo "=== Signing $APP ==="

          # 1. Sign Python extension modules — no hardened runtime (they load dynamically)
          echo "--- Signing .so / .dylib ---"
          find "$APP" -type f \( -name "*.so" -o -name "*.dylib" \) \
            | while IFS= read -r f; do
                codesign --force --sign "$SIGN_IDENTITY" "$f" 2>/dev/null || true
              done

          # 2. Sign any bare Python binary
          find "$APP" -type f -name "Python" \
            | while IFS= read -r f; do
                codesign --force --options runtime --sign "$SIGN_IDENTITY" "$f" 2>/dev/null || true
              done

          # 3. Sparkle XPC services (innermost-first)
          SPARKLE_FW="$APP/Contents/Frameworks/Sparkle.framework"
          if [ -d "$SPARKLE_FW" ]; then
            for xpc in "$SPARKLE_FW"/Versions/*/XPCServices/*.xpc; do
              [ -e "$xpc" ] || continue
              codesign --force --options runtime \
                --entitlements "$ENTITLEMENTS" --sign "$SIGN_IDENTITY" "$xpc"
            done
            for updater in "$SPARKLE_FW"/Versions/*/Updater.app; do
              [ -e "$updater" ] || continue
              codesign --force --deep --options runtime \
                --entitlements "$ENTITLEMENTS" --sign "$SIGN_IDENTITY" "$updater"
            done
            # Main Sparkle dylib
            SPARKLE_LIB="$SPARKLE_FW/Sparkle"
            [ -f "$SPARKLE_LIB" ] || SPARKLE_LIB="$SPARKLE_FW/Versions/Current/Sparkle"
            codesign --force --sign "$SIGN_IDENTITY" "$SPARKLE_LIB"
            codesign --force --sign "$SIGN_IDENTITY" "$SPARKLE_FW"
          fi

          # 4. SparkleHelper with hardened runtime
          HELPER="$APP/Contents/MacOS/SparkleHelper"
          [ -f "$HELPER" ] && codesign --force --options runtime \
            --sign "$SIGN_IDENTITY" "$HELPER"

          # 5. Main executable with hardened runtime + entitlements
          codesign --force --options runtime \
            --entitlements "$ENTITLEMENTS" --sign "$SIGN_IDENTITY" \
            "$APP/Contents/MacOS/Face-Local"

          # 6. App bundle
          codesign --force --options runtime \
            --entitlements "$ENTITLEMENTS" --sign "$SIGN_IDENTITY" "$APP"

          echo "=== Verifying ==="
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "Signing complete."

      - name: Notarize app
        if: ${{ env.SIGN_IDENTITY != '' && env.ASC_API_KEY_PRIVATE_KEY != '' }}
        env:
          ASC_API_KEY_PRIVATE_KEY: ${{ secrets.ASC_API_KEY_PRIVATE_KEY }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Notarizing ==="

          ASC_KEY_FILE="${RUNNER_TEMP}/asc_api_key.p8"
          echo "$ASC_API_KEY_PRIVATE_KEY" | base64 --decode > "$ASC_KEY_FILE"

          NOTARIZE_ZIP="${RUNNER_TEMP}/Face-Local-notarize.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/Face-Local.app" "$NOTARIZE_ZIP"

          xcrun notarytool submit "$NOTARIZE_ZIP" \
            --key          "$ASC_KEY_FILE" \
            --key-id       "$ASC_API_KEY_ID" \
            --issuer       "$ASC_API_KEY_ISSUER_ID" \
            --team-id      "$APPLE_TEAM_ID" \
            --wait --timeout 1200 --verbose

          rm -f "$ASC_KEY_FILE" "$NOTARIZE_ZIP"
          echo "NOTARIZED=true" >> "$GITHUB_ENV"
          echo "Notarization successful."

      - name: Staple notarization ticket to app
        if: ${{ env.NOTARIZED == 'true' }}
        shell: bash
        run: |
          xcrun stapler staple   "dist/Face-Local.app"
          xcrun stapler validate "dist/Face-Local.app"
          echo "Stapling complete."

      # ──────────────────────────────────────────────────────────────────────
      # Package artifacts
      # ──────────────────────────────────────────────────────────────────────

      - name: Create release directory
        shell: bash
        run: mkdir -p release

      - name: Package macOS DMG
        shell: bash
        run: |
          rm -rf release/dmg-root
          mkdir -p release/dmg-root
          cp -R "dist/Face-Local.app" "release/dmg-root/"
          ln -s /Applications "release/dmg-root/Applications"
          hdiutil create \
            -volname "Face-Local" \
            -srcfolder "release/dmg-root" \
            -ov \
            -format UDZO \
            "release/Face-Local-macOS-installer-${{ needs.prepare.outputs.package_version }}.dmg"
          rm -rf release/dmg-root

      - name: Create Sparkle ZIP
        shell: bash
        run: |
          # Sparkle requires the .app at the ZIP root.  ditto preserves
          # extended attributes, resource forks, and symlinks.
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/Face-Local.app" \
            "release/Face-Local-macOS-sparkle-${{ needs.prepare.outputs.package_version }}.zip"
          ls -lh "release/Face-Local-macOS-sparkle-${{ needs.prepare.outputs.package_version }}.zip"

      - name: Sign Sparkle ZIP with EdDSA
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          ZIP="release/Face-Local-macOS-sparkle-${{ needs.prepare.outputs.package_version }}.zip"

          KEY_FILE="${RUNNER_TEMP}/sparkle_ed_private_key"
          echo "$SPARKLE_PRIVATE_KEY" | base64 --decode > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          EDDSA_SIG="$("$SPARKLE_DIST/bin/sign_update" "$ZIP" -k "$KEY_FILE")"
          rm -f "$KEY_FILE"
          echo "EdDSA signature: $EDDSA_SIG"
          echo "SPARKLE_EDDSA_SIG=$EDDSA_SIG" >> "$GITHUB_ENV"

          python3 - <<PY
          import json, os
          from pathlib import Path
          meta = {
              "version":        "${{ needs.prepare.outputs.package_version }}",
              "build":          "${{ needs.prepare.outputs.package_version }}",
              "zip_name":       "Face-Local-macOS-sparkle-${{ needs.prepare.outputs.package_version }}.zip",
              "eddsa_signature": os.environ["SPARKLE_EDDSA_SIG"],
              "min_os_version": "12.0",
              "signed":         True,
          }
          Path("release/sparkle_meta.json").write_text(json.dumps(meta, indent=2))
          print("sparkle_meta.json written")
          PY

      - name: Write unsigned Sparkle metadata
        if: ${{ env.SPARKLE_PRIVATE_KEY == '' }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          meta = {
              "version":         "${{ needs.prepare.outputs.package_version }}",
              "build":           "${{ needs.prepare.outputs.package_version }}",
              "zip_name":        "Face-Local-macOS-sparkle-${{ needs.prepare.outputs.package_version }}.zip",
              "eddsa_signature": "",
              "min_os_version":  "12.0",
              "signed":          False,
          }
          Path("release/sparkle_meta.json").write_text(json.dumps(meta, indent=2))
          print("WARNING: SPARKLE_PRIVATE_KEY not set — appcast will have empty EdDSA signature")
          PY

      - name: Upload macOS artifact
        id: upload_macos
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: face-local-macos-${{ needs.prepare.outputs.tag }}
          path: |
            release/*.dmg
            release/*.zip
            release/sparkle_meta.json
          if-no-files-found: error

      - name: Fallback upload macOS artifact to private repo
        if: ${{ steps.upload_macos.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_ARTIFACT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v gh >/dev/null 2>&1; then
            command -v brew >/dev/null 2>&1 || {
              echo "gh CLI not found and Homebrew is unavailable." >&2
              exit 1
            }
            brew install gh
          fi

          shopt -s nullglob
          assets=(release/*.dmg release/*.zip)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No macOS artifact found in release/." >&2
            exit 1
          fi

          tag="artifact-release-${{ needs.prepare.outputs.package_version }}"
          if ! gh release view "$tag" --repo "${{ env.ARTIFACT_REPO }}" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "${{ env.ARTIFACT_REPO }}" \
              --title "CI artifact ${{ needs.prepare.outputs.tag }}" \
              --notes "CI artifact fallback [run ${{ github.run_number }}]" \
              --prerelease \
              || gh release view "$tag" --repo "${{ env.ARTIFACT_REPO }}" >/dev/null
          fi

          gh release upload "$tag" "${assets[@]}" release/sparkle_meta.json \
            --repo "${{ env.ARTIFACT_REPO }}" \
            --clobber

  build-windows:
    needs:
      - prepare
      - pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.windows_runner) }}
    steps:
      - uses: actions/checkout@v6

      - name: Selected Windows runner
        shell: powershell
        run: echo "${{ needs.pick-runner.outputs.windows_runner_note }}"

      - name: Select local Python on self-hosted Windows
        if: ${{ contains(needs.pick-runner.outputs.windows_runner, 'self-hosted') }}
        shell: powershell
        run: |
          $candidates = @(
            "python", "python3",
            "C:\Python313\python.exe", "C:\Python312\python.exe", "C:\Python311\python.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python313\python.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python312\python.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python311\python.exe",
            "C:\Program Files\Python313\python.exe",
            "C:\Program Files\Python312\python.exe",
            "C:\Program Files\Python311\python.exe"
          )
          $pyBin = $null
          foreach ($c in $candidates) {
            $bin = if ($c -notmatch '[\\/]') {
              $cmd = Get-Command $c -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($cmd) { $cmd.Source } else { $null }
            } elseif (Test-Path $c) { $c } else { $null }
            if (-not $bin) { continue }
            & $bin -c "import sys; raise SystemExit(0 if sys.version_info >= (3,11) else 1)" 2>$null
            if ($LASTEXITCODE -eq 0) { $pyBin = $bin; break }
          }
          $venvDir = Join-Path $env:RUNNER_TEMP "face-local-venv"
          if (Test-Path $venvDir) { Remove-Item $venvDir -Recurse -Force }

          if ($pyBin) {
            Write-Host "Using local Python: $pyBin"
            & $pyBin -m venv $venvDir
            if ($LASTEXITCODE -ne 0) { Write-Error "Failed to create Python virtual environment"; exit 1 }
          } else {
            Write-Host "Python 3.11+ not found on self-hosted runner; bootstrapping a local Python with uv."
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            $uvRoot = Join-Path $env:RUNNER_TEMP "uv"
            $uvZip = Join-Path $env:RUNNER_TEMP "uv.zip"
            if (Test-Path $uvRoot) { Remove-Item $uvRoot -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $uvRoot | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip" -OutFile $uvZip
            Expand-Archive -LiteralPath $uvZip -DestinationPath $uvRoot -Force
            $uv = Get-ChildItem $uvRoot -Filter "uv.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
            if (-not $uv) { Write-Error "uv.exe was not found after extraction"; exit 1 }
            $env:UV_CACHE_DIR = Join-Path $env:RUNNER_TEMP "uv-cache"
            $env:UV_PYTHON_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "uv-python"
            & $uv --version
            & $uv python install 3.11
            if ($LASTEXITCODE -ne 0) { Write-Error "uv failed to install Python 3.11"; exit 1 }
            & $uv venv --seed $venvDir --python 3.11
            if ($LASTEXITCODE -ne 0) { Write-Error "uv failed to create Python virtual environment"; exit 1 }
          }

          Add-Content $env:GITHUB_PATH (Join-Path $venvDir "Scripts")
          Add-Content $env:GITHUB_ENV "VIRTUAL_ENV=$venvDir"
          $venvPython = Join-Path $venvDir "Scripts\python.exe"
          & $venvPython --version
          & $venvPython -m pip --version
          if ($LASTEXITCODE -ne 0) { Write-Error "pip is not available in the Python virtual environment"; exit 1 }

      - uses: actions/setup-python@v6
        if: ${{ !contains(needs.pick-runner.outputs.windows_runner, 'self-hosted') }}
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install . pyinstaller
          # Verify TFLite backend installed (ai-edge-litert is in base deps, this is a safety check)
          python -c "from ai_edge_litert.interpreter import Interpreter; print('ai-edge-litert OK')" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "ai-edge-litert not available for this Python version. Trying explicit install..."
            python -m pip install "ai-edge-litert>=1.0" --quiet
            python -c "from ai_edge_litert.interpreter import Interpreter; print('ai-edge-litert OK (explicit)')" 2>$null
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "ai-edge-litert still not available. Build will use SFace/HOG fallback for embeddings."
            }
          }

      - name: Download embedding models
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path models | Out-Null
          $facenet = "models\mobilefacenet.tflite"
          if (-not (Test-Path $facenet)) {
            $mirrors = @(
              "https://github.com/MCarlomagno/FaceRecognitionAuth/raw/refs/heads/master/assets/mobilefacenet.tflite",
              "https://github.com/pb-julian/liteface/raw/main/tflite_models/mobilefacenet.tflite"
            )
            $ok = $false
            foreach ($url in $mirrors) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $facenet -UseBasicParsing -ErrorAction Stop
                Write-Host "Downloaded mobilefacenet.tflite from $url"
                $ok = $true
                break
              } catch { Write-Warning "Mirror failed: $url" }
            }
            if (-not $ok) { throw "ERROR: Failed to download mobilefacenet.tflite from all mirrors" }
          }
          $sface = "models\face_recognition_sface_2021dec.onnx"
          if (-not (Test-Path $sface)) {
            try {
              Invoke-WebRequest -Uri "https://github.com/opencv/opencv_zoo/raw/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx" -OutFile $sface -UseBasicParsing -ErrorAction Stop
            } catch { Write-Warning "SFace model download failed (non-fatal)" }
          }

      - name: Build bundled app
        shell: powershell
        run: python scripts/package_app.py --version "${{ needs.prepare.outputs.package_version }}"

      - name: Create release directory
        shell: powershell
        run: New-Item -ItemType Directory -Force -Path release | Out-Null

      - name: Package Windows assets
        shell: powershell
        run: |
          Compress-Archive -Path "dist\Face-Local\*" -DestinationPath "release\Face-Local-windows-portable-${{ needs.prepare.outputs.package_version }}.zip" -Force

          # Per-user install target — no admin rights required.
          $installDir = Join-Path $env:RUNNER_TEMP "InnoSetup6"
          $isccCandidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            (Join-Path $installDir "ISCC.exe")
          )
          function Find-ISCC { $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1 }

          $iscc = Find-ISCC
          if (-not $iscc) {
            Write-Host "Inno Setup 6 not found - installing via direct download (per-user, no admin required)."
            try {
              [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
              $isTmp = Join-Path $env:RUNNER_TEMP "innosetup-installer.exe"
              Invoke-WebRequest -UseBasicParsing -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile $isTmp
              if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
              $proc = Start-Process -FilePath $isTmp `
                -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/CURRENTUSER","/DIR=$installDir" `
                -Wait -PassThru
              Write-Host "Inno Setup installer exited with code $($proc.ExitCode)"
              Remove-Item $isTmp -ErrorAction SilentlyContinue
            } catch { Write-Warning "Direct Inno Setup download/install failed: $_" }
            $iscc = Find-ISCC
          }

          if (-not $iscc) {
            Write-Error "Inno Setup 6 (ISCC.exe) could not be found or installed. Pre-install Inno Setup 6 on this runner, or ensure Chocolatey/winget is available in an elevated context."
            exit 1
          }
          Write-Host "Using ISCC: $iscc"
          & $iscc "/DAppVersion=${{ needs.prepare.outputs.package_version }}" "scripts\build_windows_installer.iss"
          if ($LASTEXITCODE -ne 0) { Write-Error "ISCC exited with code $LASTEXITCODE"; exit $LASTEXITCODE }

      - name: Upload Windows artifact
        id: upload_windows
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: face-local-windows-${{ needs.prepare.outputs.tag }}
          path: |
            release/*.zip
            release/*.exe
          if-no-files-found: error

      - name: Fallback upload Windows artifact to private repo
        if: ${{ steps.upload_windows.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_ARTIFACT_TOKEN }}
        shell: powershell
        run: |
          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
            $ErrorActionPreference = "Stop"
            $GhVersion = (Invoke-RestMethod "https://api.github.com/repos/cli/cli/releases/latest").tag_name.TrimStart('v')
            $GhZip = Join-Path $env:RUNNER_TEMP "gh_windows_amd64.zip"
            $GhDir = Join-Path $env:RUNNER_TEMP "gh-bin"
            Invoke-WebRequest -Uri "https://github.com/cli/cli/releases/download/v${GhVersion}/gh_${GhVersion}_windows_amd64.zip" -OutFile $GhZip
            Expand-Archive -Path $GhZip -DestinationPath $GhDir -Force
            $GhExe = Get-ChildItem -Path $GhDir -Filter "gh.exe" -Recurse | Select-Object -First 1
            if ($null -eq $GhExe) { throw "gh.exe not found after extraction in $GhDir" }
            $env:PATH = "$($GhExe.DirectoryName);$env:PATH"
          }

          $Assets = @()
          $Assets += Get-ChildItem -Path "release" -Filter "*.zip" -File | ForEach-Object { $_.FullName }
          $Assets += Get-ChildItem -Path "release" -Filter "*.exe" -File | ForEach-Object { $_.FullName }
          if ($Assets.Count -eq 0) { throw "No Windows artifacts found in release/." }

          $Tag = "artifact-release-${{ needs.prepare.outputs.package_version }}"

          $ErrorActionPreference = "SilentlyContinue"
          $null = gh release view $Tag --repo "${{ env.ARTIFACT_REPO }}" 2>&1
          $releaseExists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = "Stop"

          if (-not $releaseExists) {
            gh release create $Tag `
              --repo "${{ env.ARTIFACT_REPO }}" `
              --title "CI artifact ${{ needs.prepare.outputs.tag }}" `
              --notes "CI artifact fallback [run ${{ github.run_number }}]" `
              --prerelease
            if ($LASTEXITCODE -ne 0) {
              gh release view $Tag --repo "${{ env.ARTIFACT_REPO }}"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

          gh release upload $Tag @Assets `
            --repo "${{ env.ARTIFACT_REPO }}" `
            --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  build-linux-arm64:
    needs: prepare
    runs-on:
      - self-hosted
      - Linux
      - ARM64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install Linux packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          packages=(dpkg-dev libgl1 libglib2.0-0 libxkbcommon-x11-0 libxcb-cursor0)
          missing=()
          for package in "${packages[@]}"; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q "install ok installed"; then
              missing+=("$package")
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "Linux packaging dependencies are already installed."
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          else
            echo "::warning::Missing Linux packages: ${missing[*]}. This self-hosted runner cannot run sudo without a password, so continuing without apt install. Install these packages once on the runner if the build fails."
          fi

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install . pyinstaller

      - name: Download embedding models
        shell: bash
        run: |
          mkdir -p models
          if [ ! -f models/mobilefacenet.tflite ]; then
            mirrors=(
              "https://github.com/MCarlomagno/FaceRecognitionAuth/raw/refs/heads/master/assets/mobilefacenet.tflite"
              "https://github.com/pb-julian/liteface/raw/main/tflite_models/mobilefacenet.tflite"
            )
            for url in "${mirrors[@]}"; do
              if curl -fsSL --retry 3 -o models/mobilefacenet.tflite "$url"; then
                echo "Downloaded mobilefacenet.tflite from $url"
                break
              fi
            done
            [ -f models/mobilefacenet.tflite ] || { echo "ERROR: Failed to download mobilefacenet.tflite"; exit 1; }
          fi
          if [ ! -f models/face_recognition_sface_2021dec.onnx ]; then
            curl -fsSL --retry 3 \
              -o models/face_recognition_sface_2021dec.onnx \
              "https://github.com/opencv/opencv_zoo/raw/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx" \
              || echo "WARNING: SFace model download failed (non-fatal)"
          fi

      - name: Build bundled app
        shell: bash
        run: python scripts/package_app.py --version "${{ needs.prepare.outputs.package_version }}"

      - name: Create release directory
        shell: bash
        run: mkdir -p release

      - name: Package Linux installer
        shell: bash
        run: |
          chmod +x scripts/build_linux_deb.sh
          scripts/build_linux_deb.sh "${{ needs.prepare.outputs.package_version }}"

      - name: Upload Linux ARM64 artifact
        id: upload_linux_arm64
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: face-local-linux-arm64-${{ needs.prepare.outputs.tag }}
          path: |
            release/*.deb
            release/*.tar.gz
          if-no-files-found: error

      - name: Fallback upload Linux ARM64 artifact to private repo
        if: ${{ steps.upload_linux_arm64.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_ARTIFACT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "gh CLI not found. Install GitHub CLI on this runner for artifact fallback uploads." >&2
            exit 1
          fi

          shopt -s nullglob
          assets=(release/*.deb release/*.tar.gz)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No Linux ARM64 artifacts found in release/." >&2
            exit 1
          fi

          tag="artifact-release-${{ needs.prepare.outputs.package_version }}"
          if ! gh release view "$tag" --repo "${{ env.ARTIFACT_REPO }}" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "${{ env.ARTIFACT_REPO }}" \
              --title "CI artifact ${{ needs.prepare.outputs.tag }}" \
              --notes "CI artifact fallback [run ${{ github.run_number }}]" \
              --prerelease \
              || gh release view "$tag" --repo "${{ env.ARTIFACT_REPO }}" >/dev/null
          fi

          gh release upload "$tag" "${assets[@]}" \
            --repo "${{ env.ARTIFACT_REPO }}" \
            --clobber

