name: Build And Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: read

env:
  PYTHON_VERSION: "3.11"
  APP_NAME: Face-Local
  OWNER: ${{ github.repository_owner }}
  ARTIFACT_REPO: ${{ github.repository_owner }}/private_artifact

jobs:
  pick-runner:
    name: Pick build runner
    runs-on:
      - self-hosted
      - Linux
      - ARM64
    outputs:
      mac_runner: ${{ steps.pick_mac.outputs.runner }}
      mac_runner_note: ${{ steps.pick_mac.outputs.runner_note }}
      windows_runner: ${{ steps.pick_windows.outputs.runner }}
      windows_runner_note: ${{ steps.pick_windows.outputs.runner_note }}
    steps:
      - name: Pick macOS runner
        id: pick_mac
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          RUNNER_NAME: Koncsik-MacBook-Air
        shell: bash
        run: |
          PYTHON_BIN="$(command -v python3 || command -v python || true)"
          STATUS=""
          if [ -n "$PYTHON_BIN" ]; then
            STATUS=$("$PYTHON_BIN" - <<'PY' 2>/dev/null || true
          import json
          import os
          import urllib.request

          token = os.environ.get("GH_TOKEN", "")
          if not token:
              raise SystemExit(0)

          request = urllib.request.Request(
              f"https://api.github.com/orgs/{os.environ['OWNER']}/actions/runners",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)

          for runner in payload.get("runners", []):
              if runner.get("name") == os.environ["RUNNER_NAME"]:
                  print(runner.get("status", ""))
                  break
          PY
            )
          fi

          if [ "$STATUS" = "online" ]; then
            echo 'runner=["self-hosted", "macOS", "ARM64"]' >> "$GITHUB_OUTPUT"
            echo 'runner_note=Runner: Koncsik-MacBook-Air (online)' >> "$GITHUB_OUTPUT"
          else
            echo 'runner=["macos-latest"]' >> "$GITHUB_OUTPUT"
            echo 'runner_note=Runner: macos-latest (fallback)' >> "$GITHUB_OUTPUT"
          fi

      - name: Pick Windows runner
        id: pick_windows
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          RUNNER_NAME: nagy_gep_windows
        shell: bash
        run: |
          PYTHON_BIN="$(command -v python3 || command -v python || true)"
          STATUS=""
          if [ -n "$PYTHON_BIN" ]; then
            STATUS=$("$PYTHON_BIN" - <<'PY' 2>/dev/null || true
          import json
          import os
          import urllib.request

          token = os.environ.get("GH_TOKEN", "")
          if not token:
              raise SystemExit(0)

          request = urllib.request.Request(
              f"https://api.github.com/orgs/{os.environ['OWNER']}/actions/runners",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)

          for runner in payload.get("runners", []):
              if runner.get("name") == os.environ["RUNNER_NAME"]:
                  print(runner.get("status", ""))
                  break
          PY
            )
          fi

          if [ "$STATUS" = "online" ]; then
            echo 'runner=["self-hosted", "Windows", "X64"]' >> "$GITHUB_OUTPUT"
            echo 'runner_note=Runner: nagy_gep_windows (online)' >> "$GITHUB_OUTPUT"
          else
            echo 'runner=["windows-latest"]' >> "$GITHUB_OUTPUT"
            echo 'runner_note=Runner: windows-latest (fallback)' >> "$GITHUB_OUTPUT"
          fi

  prepare:
    runs-on:
      - self-hosted
      - Linux
      - ARM64
    outputs:
      base_version: ${{ steps.meta.outputs.base_version }}
      package_version: ${{ steps.meta.outputs.package_version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - id: meta
        shell: bash
        run: |
          git fetch --tags --force
          export BASE_VERSION="$(python - <<'PY'
          import os
          import re
          import subprocess
          import tomllib

          with open("pyproject.toml", "rb") as fh:
              configured = tomllib.load(fh)["project"]["version"]

          match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", configured)
          if not match:
              raise SystemExit(f"pyproject version must be semver x.y.z, got: {configured}")

          major, minor, patch_floor = map(int, match.groups())
          prefix = f"v{major}.{minor}."
          tags = subprocess.check_output(["git", "tag", "--list", f"{prefix}*"], text=True).splitlines()

          patch_numbers = []
          for tag in tags:
              tag_match = re.fullmatch(rf"v{major}\.{minor}\.(\d+)", tag.strip())
              if tag_match:
                  patch_numbers.append(int(tag_match.group(1)))

          next_patch = patch_floor if not patch_numbers else max(max(patch_numbers) + 1, patch_floor)
          print(f"{major}.{minor}.{next_patch}")
          PY
          )"
          PACKAGE_VERSION="$BASE_VERSION"
          TAG="v${PACKAGE_VERSION}"
          RELEASE_NAME="Face-Local v${PACKAGE_VERSION}"

          {
            echo "base_version=$BASE_VERSION"
            echo "package_version=$PACKAGE_VERSION"
            echo "tag=$TAG"
            echo "release_name=$RELEASE_NAME"
          } >> "$GITHUB_OUTPUT"

  build-macos:
    needs:
      - prepare
      - pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.mac_runner) }}
    steps:
      - uses: actions/checkout@v6

      - name: Selected macOS runner
        shell: bash
        run: echo "${{ needs.pick-runner.outputs.mac_runner_note }}"

      - name: Prepare writable Python tool cache
        if: ${{ !contains(needs.pick-runner.outputs.mac_runner, 'self-hosted') }}
        shell: bash
        run: |
          TOOLCACHE="${RUNNER_TEMP}/hostedtoolcache"
          mkdir -p "$TOOLCACHE"
          echo "AGENT_TOOLSDIRECTORY=$TOOLCACHE" >> "$GITHUB_ENV"
          echo "RUNNER_TOOL_CACHE=$TOOLCACHE" >> "$GITHUB_ENV"

      - name: Select local Python on self-hosted macOS
        if: ${{ contains(needs.pick-runner.outputs.mac_runner, 'self-hosted') }}
        shell: bash
        run: |
          find_python() {
            for candidate in python3.13 python3.12 python3.11 python3 python; do
              local bin
              bin="$(command -v "$candidate" 2>/dev/null)" || continue
              if "$bin" - <<'PY' >/dev/null 2>&1
          import sys
          raise SystemExit(0 if sys.version_info >= (3, 11) else 1)
          PY
              then
                echo "$bin"
                return 0
              fi
            done
            # also check well-known Homebrew locations not always on PATH
            for candidate in \
              /opt/homebrew/bin/python3.13 \
              /opt/homebrew/bin/python3.12 \
              /opt/homebrew/bin/python3.11 \
              /usr/local/bin/python3.13 \
              /usr/local/bin/python3.12 \
              /usr/local/bin/python3.11; do
              [ -x "$candidate" ] || continue
              if "$candidate" - <<'PY' >/dev/null 2>&1
          import sys
          raise SystemExit(0 if sys.version_info >= (3, 11) else 1)
          PY
              then
                echo "$candidate"
                return 0
              fi
            done
            return 1
          }

          PY_BIN="$(find_python)" || {
            echo "Python 3.11+ not found — installing via Homebrew..." >&2
            brew install python@3.11 >&2
            PY_BIN="$(find_python)" || {
              echo "Python 3.11+ was not found even after Homebrew install." >&2
              exit 1
            }
          }

          VENV_DIR="${RUNNER_TEMP}/venv"
          "$PY_BIN" -m venv "$VENV_DIR"
          echo "$VENV_DIR/bin" >> "$GITHUB_PATH"
          echo "MACOS_PYTHON_BIN=$PY_BIN" >> "$GITHUB_ENV"
          "$PY_BIN" --version

      - uses: actions/setup-python@v6
        if: ${{ !contains(needs.pick-runner.outputs.mac_runner, 'self-hosted') }}
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install . pyinstaller

      - name: Download embedding models
        shell: bash
        run: |
          mkdir -p models
          if [ ! -f models/mobilefacenet.tflite ]; then
            mirrors=(
              "https://github.com/shubham0204/FaceRecognition_With_FaceNet_Android/raw/master/app/src/main/assets/mobile_face_net.tflite"
              "https://github.com/estebanuri/face_recognition/raw/master/android/face-recognition/app/src/main/assets/mobile_face_net.tflite"
              "https://github.com/Martlgap/FaceIDLight/raw/main/facelib/models/pretrained/mobileFaceNet.tflite"
            )
            for url in "${mirrors[@]}"; do
              if curl -fsSL --retry 3 -o models/mobilefacenet.tflite "$url"; then
                echo "Downloaded mobilefacenet.tflite from $url"
                break
              fi
            done
            [ -f models/mobilefacenet.tflite ] || { echo "ERROR: Failed to download mobilefacenet.tflite"; exit 1; }
          fi
          if [ ! -f models/face_recognition_sface_2021dec.onnx ]; then
            curl -fsSL --retry 3 \
              -o models/face_recognition_sface_2021dec.onnx \
              "https://github.com/opencv/opencv_zoo/raw/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx" \
              || echo "WARNING: SFace model download failed (non-fatal)"
          fi

      - name: Build bundled app
        shell: bash
        run: python scripts/package_app.py --version "${{ needs.prepare.outputs.package_version }}"

      - name: Create release directory
        shell: bash
        run: mkdir -p release

      - name: Package macOS app
        shell: bash
        run: |
          rm -rf release/dmg-root
          mkdir -p release/dmg-root
          cp -R "dist/Face-Local.app" "release/dmg-root/"
          ln -s /Applications "release/dmg-root/Applications"
          hdiutil create \
            -volname "Face-Local" \
            -srcfolder "release/dmg-root" \
            -ov \
            -format UDZO \
            "release/Face-Local-macOS-installer-${{ needs.prepare.outputs.package_version }}.dmg"
          rm -rf release/dmg-root

      - name: Upload macOS artifact
        id: upload_macos
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: face-local-macos-${{ needs.prepare.outputs.tag }}
          path: release/*.dmg
          if-no-files-found: error

      - name: Fallback upload macOS artifact to private repo
        if: ${{ steps.upload_macos.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_ARTIFACT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v gh >/dev/null 2>&1; then
            command -v brew >/dev/null 2>&1 || {
              echo "gh CLI not found and Homebrew is unavailable." >&2
              exit 1
            }
            brew install gh
          fi

          shopt -s nullglob
          assets=(release/*.dmg)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No macOS artifact found in release/." >&2
            exit 1
          fi

          tag="artifact-release-${{ needs.prepare.outputs.package_version }}"
          if ! gh release view "$tag" --repo "${{ env.ARTIFACT_REPO }}" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "${{ env.ARTIFACT_REPO }}" \
              --title "CI artifact ${{ needs.prepare.outputs.tag }}" \
              --notes "CI artifact fallback [run ${{ github.run_number }}]" \
              --prerelease \
              || gh release view "$tag" --repo "${{ env.ARTIFACT_REPO }}" >/dev/null
          fi

          gh release upload "$tag" "${assets[@]}" \
            --repo "${{ env.ARTIFACT_REPO }}" \
            --clobber

  build-windows:
    needs:
      - prepare
      - pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.windows_runner) }}
    steps:
      - uses: actions/checkout@v6

      - name: Selected Windows runner
        shell: powershell
        run: echo "${{ needs.pick-runner.outputs.windows_runner_note }}"

      - name: Select local Python on self-hosted Windows
        if: ${{ contains(needs.pick-runner.outputs.windows_runner, 'self-hosted') }}
        shell: powershell
        run: |
          $candidates = @(
            "python", "python3",
            "C:\Python313\python.exe", "C:\Python312\python.exe", "C:\Python311\python.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python313\python.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python312\python.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python311\python.exe",
            "C:\Program Files\Python313\python.exe",
            "C:\Program Files\Python312\python.exe",
            "C:\Program Files\Python311\python.exe"
          )
          $pyBin = $null
          foreach ($c in $candidates) {
            $bin = if ($c -notmatch '[\\/]') {
              $cmd = Get-Command $c -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($cmd) { $cmd.Source } else { $null }
            } elseif (Test-Path $c) { $c } else { $null }
            if (-not $bin) { continue }
            & $bin -c "import sys; raise SystemExit(0 if sys.version_info >= (3,11) else 1)" 2>$null
            if ($LASTEXITCODE -eq 0) { $pyBin = $bin; break }
          }
          $venvDir = Join-Path $env:RUNNER_TEMP "face-local-venv"
          if (Test-Path $venvDir) { Remove-Item $venvDir -Recurse -Force }

          if ($pyBin) {
            Write-Host "Using local Python: $pyBin"
            & $pyBin -m venv $venvDir
            if ($LASTEXITCODE -ne 0) { Write-Error "Failed to create Python virtual environment"; exit 1 }
          } else {
            Write-Host "Python 3.11+ not found on self-hosted runner; bootstrapping a local Python with uv."
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            $uvRoot = Join-Path $env:RUNNER_TEMP "uv"
            $uvZip = Join-Path $env:RUNNER_TEMP "uv.zip"
            if (Test-Path $uvRoot) { Remove-Item $uvRoot -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $uvRoot | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip" -OutFile $uvZip
            Expand-Archive -LiteralPath $uvZip -DestinationPath $uvRoot -Force
            $uv = Get-ChildItem $uvRoot -Filter "uv.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
            if (-not $uv) { Write-Error "uv.exe was not found after extraction"; exit 1 }
            $env:UV_CACHE_DIR = Join-Path $env:RUNNER_TEMP "uv-cache"
            $env:UV_PYTHON_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "uv-python"
            & $uv --version
            & $uv python install 3.11
            if ($LASTEXITCODE -ne 0) { Write-Error "uv failed to install Python 3.11"; exit 1 }
            & $uv venv --seed $venvDir --python 3.11
            if ($LASTEXITCODE -ne 0) { Write-Error "uv failed to create Python virtual environment"; exit 1 }
          }

          Add-Content $env:GITHUB_PATH (Join-Path $venvDir "Scripts")
          Add-Content $env:GITHUB_ENV "VIRTUAL_ENV=$venvDir"
          $venvPython = Join-Path $venvDir "Scripts\python.exe"
          & $venvPython --version
          & $venvPython -m pip --version
          if ($LASTEXITCODE -ne 0) { Write-Error "pip is not available in the Python virtual environment"; exit 1 }

      - uses: actions/setup-python@v6
        if: ${{ !contains(needs.pick-runner.outputs.windows_runner, 'self-hosted') }}
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install . pyinstaller

      - name: Download embedding models
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path models | Out-Null
          $facenet = "models\mobilefacenet.tflite"
          if (-not (Test-Path $facenet)) {
            $mirrors = @(
              "https://github.com/shubham0204/FaceRecognition_With_FaceNet_Android/raw/master/app/src/main/assets/mobile_face_net.tflite",
              "https://github.com/estebanuri/face_recognition/raw/master/android/face-recognition/app/src/main/assets/mobile_face_net.tflite",
              "https://github.com/Martlgap/FaceIDLight/raw/main/facelib/models/pretrained/mobileFaceNet.tflite"
            )
            $ok = $false
            foreach ($url in $mirrors) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $facenet -UseBasicParsing -ErrorAction Stop
                Write-Host "Downloaded mobilefacenet.tflite from $url"
                $ok = $true
                break
              } catch { Write-Warning "Mirror failed: $url" }
            }
            if (-not $ok) { throw "ERROR: Failed to download mobilefacenet.tflite from all mirrors" }
          }
          $sface = "models\face_recognition_sface_2021dec.onnx"
          if (-not (Test-Path $sface)) {
            try {
              Invoke-WebRequest -Uri "https://github.com/opencv/opencv_zoo/raw/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx" -OutFile $sface -UseBasicParsing -ErrorAction Stop
            } catch { Write-Warning "SFace model download failed (non-fatal)" }
          }

      - name: Build bundled app
        shell: powershell
        run: python scripts/package_app.py --version "${{ needs.prepare.outputs.package_version }}"

      - name: Create release directory
        shell: powershell
        run: New-Item -ItemType Directory -Force -Path release | Out-Null

      - name: Package Windows assets
        env:
          IS_SELF_HOSTED_WINDOWS: ${{ contains(needs.pick-runner.outputs.windows_runner, 'self-hosted') }}
        shell: powershell
        run: |
          Compress-Archive -Path "dist\Face-Local\*" -DestinationPath "release\Face-Local-windows-portable-${{ needs.prepare.outputs.package_version }}.zip" -Force

          $isccCandidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            if ($env:IS_SELF_HOSTED_WINDOWS -eq "true") {
              Write-Warning "Inno Setup 6 ISCC.exe not found. Skipping Windows installer; portable zip was created. Install Inno Setup once on the self-hosted Windows runner to also publish the .exe installer."
              exit 0
            }
            choco install innosetup --no-progress -y
            $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { Write-Error "Inno Setup 6 ISCC.exe not found after Chocolatey installation."; exit 1 }
          & $iscc "/DAppVersion=${{ needs.prepare.outputs.package_version }}" "scripts\build_windows_installer.iss"

      - name: Upload Windows artifact
        id: upload_windows
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: face-local-windows-${{ needs.prepare.outputs.tag }}
          path: |
            release/*.zip
            release/*.exe
          if-no-files-found: error

      - name: Fallback upload Windows artifact to private repo
        if: ${{ steps.upload_windows.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_ARTIFACT_TOKEN }}
        shell: powershell
        run: |
          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
            $ErrorActionPreference = "Stop"
            $GhVersion = (Invoke-RestMethod "https://api.github.com/repos/cli/cli/releases/latest").tag_name.TrimStart('v')
            $GhZip = Join-Path $env:RUNNER_TEMP "gh_windows_amd64.zip"
            $GhDir = Join-Path $env:RUNNER_TEMP "gh-bin"
            Invoke-WebRequest -Uri "https://github.com/cli/cli/releases/download/v${GhVersion}/gh_${GhVersion}_windows_amd64.zip" -OutFile $GhZip
            Expand-Archive -Path $GhZip -DestinationPath $GhDir -Force
            $GhExe = Get-ChildItem -Path $GhDir -Filter "gh.exe" -Recurse | Select-Object -First 1
            if ($null -eq $GhExe) { throw "gh.exe not found after extraction in $GhDir" }
            $env:PATH = "$($GhExe.DirectoryName);$env:PATH"
          }

          $Assets = @()
          $Assets += Get-ChildItem -Path "release" -Filter "*.zip" -File | ForEach-Object { $_.FullName }
          $Assets += Get-ChildItem -Path "release" -Filter "*.exe" -File | ForEach-Object { $_.FullName }
          if ($Assets.Count -eq 0) { throw "No Windows artifacts found in release/." }

          $Tag = "artifact-release-${{ needs.prepare.outputs.package_version }}"

          $ErrorActionPreference = "SilentlyContinue"
          $null = gh release view $Tag --repo "${{ env.ARTIFACT_REPO }}" 2>&1
          $releaseExists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = "Stop"

          if (-not $releaseExists) {
            gh release create $Tag `
              --repo "${{ env.ARTIFACT_REPO }}" `
              --title "CI artifact ${{ needs.prepare.outputs.tag }}" `
              --notes "CI artifact fallback [run ${{ github.run_number }}]" `
              --prerelease
            if ($LASTEXITCODE -ne 0) {
              gh release view $Tag --repo "${{ env.ARTIFACT_REPO }}"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

          gh release upload $Tag @Assets `
            --repo "${{ env.ARTIFACT_REPO }}" `
            --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  build-linux-arm64:
    needs: prepare
    runs-on:
      - self-hosted
      - Linux
      - ARM64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install Linux packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          packages=(dpkg-dev libgl1 libglib2.0-0 libxkbcommon-x11-0 libxcb-cursor0)
          missing=()
          for package in "${packages[@]}"; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q "install ok installed"; then
              missing+=("$package")
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "Linux packaging dependencies are already installed."
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          else
            echo "::warning::Missing Linux packages: ${missing[*]}. This self-hosted runner cannot run sudo without a password, so continuing without apt install. Install these packages once on the runner if the build fails."
          fi

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install . pyinstaller

      - name: Download embedding models
        shell: bash
        run: |
          mkdir -p models
          if [ ! -f models/mobilefacenet.tflite ]; then
            mirrors=(
              "https://github.com/shubham0204/FaceRecognition_With_FaceNet_Android/raw/master/app/src/main/assets/mobile_face_net.tflite"
              "https://github.com/estebanuri/face_recognition/raw/master/android/face-recognition/app/src/main/assets/mobile_face_net.tflite"
              "https://github.com/Martlgap/FaceIDLight/raw/main/facelib/models/pretrained/mobileFaceNet.tflite"
            )
            for url in "${mirrors[@]}"; do
              if curl -fsSL --retry 3 -o models/mobilefacenet.tflite "$url"; then
                echo "Downloaded mobilefacenet.tflite from $url"
                break
              fi
            done
            [ -f models/mobilefacenet.tflite ] || { echo "ERROR: Failed to download mobilefacenet.tflite"; exit 1; }
          fi
          if [ ! -f models/face_recognition_sface_2021dec.onnx ]; then
            curl -fsSL --retry 3 \
              -o models/face_recognition_sface_2021dec.onnx \
              "https://github.com/opencv/opencv_zoo/raw/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx" \
              || echo "WARNING: SFace model download failed (non-fatal)"
          fi

      - name: Build bundled app
        shell: bash
        run: python scripts/package_app.py --version "${{ needs.prepare.outputs.package_version }}"

      - name: Create release directory
        shell: bash
        run: mkdir -p release

      - name: Package Linux installer
        shell: bash
        run: |
          chmod +x scripts/build_linux_deb.sh
          scripts/build_linux_deb.sh "${{ needs.prepare.outputs.package_version }}"

      - name: Upload Linux ARM64 artifact
        id: upload_linux_arm64
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: face-local-linux-arm64-${{ needs.prepare.outputs.tag }}
          path: |
            release/*.deb
            release/*.tar.gz
          if-no-files-found: error

      - name: Fallback upload Linux ARM64 artifact to private repo
        if: ${{ steps.upload_linux_arm64.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_ARTIFACT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "gh CLI not found. Install GitHub CLI on this runner for artifact fallback uploads." >&2
            exit 1
          fi

          shopt -s nullglob
          assets=(release/*.deb release/*.tar.gz)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No Linux ARM64 artifacts found in release/." >&2
            exit 1
          fi

          tag="artifact-release-${{ needs.prepare.outputs.package_version }}"
          if ! gh release view "$tag" --repo "${{ env.ARTIFACT_REPO }}" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "${{ env.ARTIFACT_REPO }}" \
              --title "CI artifact ${{ needs.prepare.outputs.tag }}" \
              --notes "CI artifact fallback [run ${{ github.run_number }}]" \
              --prerelease \
              || gh release view "$tag" --repo "${{ env.ARTIFACT_REPO }}" >/dev/null
          fi

          gh release upload "$tag" "${assets[@]}" \
            --repo "${{ env.ARTIFACT_REPO }}" \
            --clobber

  build-linux-x64:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install Linux packaging dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libgl1 libglib2.0-0 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install . pyinstaller

      - name: Download embedding models
        shell: bash
        run: |
          mkdir -p models
          if [ ! -f models/mobilefacenet.tflite ]; then
            mirrors=(
              "https://github.com/shubham0204/FaceRecognition_With_FaceNet_Android/raw/master/app/src/main/assets/mobile_face_net.tflite"
              "https://github.com/estebanuri/face_recognition/raw/master/android/face-recognition/app/src/main/assets/mobile_face_net.tflite"
              "https://github.com/Martlgap/FaceIDLight/raw/main/facelib/models/pretrained/mobileFaceNet.tflite"
            )
            for url in "${mirrors[@]}"; do
              if curl -fsSL --retry 3 -o models/mobilefacenet.tflite "$url"; then
                echo "Downloaded mobilefacenet.tflite from $url"
                break
              fi
            done
            [ -f models/mobilefacenet.tflite ] || { echo "ERROR: Failed to download mobilefacenet.tflite"; exit 1; }
          fi
          if [ ! -f models/face_recognition_sface_2021dec.onnx ]; then
            curl -fsSL --retry 3 \
              -o models/face_recognition_sface_2021dec.onnx \
              "https://github.com/opencv/opencv_zoo/raw/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx" \
              || echo "WARNING: SFace model download failed (non-fatal)"
          fi

      - name: Build bundled app
        shell: bash
        run: python scripts/package_app.py --version "${{ needs.prepare.outputs.package_version }}"

      - name: Create release directory
        shell: bash
        run: mkdir -p release

      - name: Package Linux x64 installer
        shell: bash
        run: |
          chmod +x scripts/build_linux_deb.sh
          scripts/build_linux_deb.sh "${{ needs.prepare.outputs.package_version }}"

      - name: Upload Linux x64 artifact
        id: upload_linux_x64
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: face-local-linux-x64-${{ needs.prepare.outputs.tag }}
          path: |
            release/*.deb
            release/*.tar.gz
          if-no-files-found: error

      - name: Fallback upload Linux x64 artifact to private repo
        if: ${{ steps.upload_linux_x64.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_ARTIFACT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "gh CLI not found. Install GitHub CLI on this runner for artifact fallback uploads." >&2
            exit 1
          fi

          shopt -s nullglob
          assets=(release/*.deb release/*.tar.gz)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No Linux x64 artifacts found in release/." >&2
            exit 1
          fi

          tag="artifact-release-${{ needs.prepare.outputs.package_version }}"
          if ! gh release view "$tag" --repo "${{ env.ARTIFACT_REPO }}" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "${{ env.ARTIFACT_REPO }}" \
              --title "CI artifact ${{ needs.prepare.outputs.tag }}" \
              --notes "CI artifact fallback [run ${{ github.run_number }}]" \
              --prerelease \
              || gh release view "$tag" --repo "${{ env.ARTIFACT_REPO }}" >/dev/null
          fi

          gh release upload "$tag" "${assets[@]}" \
            --repo "${{ env.ARTIFACT_REPO }}" \
            --clobber

  release:
    if: >-
      ${{
        always() &&
        (
          needs.build-macos.result == 'success' ||
          needs.build-windows.result == 'success' ||
          needs.build-linux-arm64.result == 'success' ||
          needs.build-linux-x64.result == 'success'
        )
      }}
    needs:
      - prepare
      - pick-runner
      - build-macos
      - build-windows
      - build-linux-arm64
      - build-linux-x64
    runs-on:
      - self-hosted
      - Linux
      - ARM64
    steps:
      - uses: actions/checkout@v6

      - name: Download macOS artifact
        id: download_macos
        if: ${{ needs.build-macos.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: face-local-macos-${{ needs.prepare.outputs.tag }}
          path: release

      - name: Fallback download macOS artifact from private repo
        if: ${{ needs.build-macos.result == 'success' && steps.download_macos.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_ARTIFACT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          if ! command -v gh >/dev/null 2>&1; then
            echo "gh CLI not found. Install GitHub CLI on this runner for artifact fallback downloads." >&2
            exit 1
          fi
          gh release download "artifact-release-${{ needs.prepare.outputs.package_version }}" \
            --repo "${{ env.ARTIFACT_REPO }}" \
            --pattern "Face-Local-macOS-installer-${{ needs.prepare.outputs.package_version }}.dmg" \
            --dir release

      - name: Download Windows artifact
        id: download_windows
        if: ${{ needs.build-windows.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: face-local-windows-${{ needs.prepare.outputs.tag }}
          path: release

      - name: Fallback download Windows artifact from private repo
        if: ${{ needs.build-windows.result == 'success' && steps.download_windows.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_ARTIFACT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          if ! command -v gh >/dev/null 2>&1; then
            echo "gh CLI not found. Install GitHub CLI on this runner for artifact fallback downloads." >&2
            exit 1
          fi
          gh release download "artifact-release-${{ needs.prepare.outputs.package_version }}" \
            --repo "${{ env.ARTIFACT_REPO }}" \
            --pattern "Face-Local-windows-*-${{ needs.prepare.outputs.package_version }}.*" \
            --dir release

      - name: Download Linux ARM64 artifact
        id: download_linux_arm64
        if: ${{ needs.build-linux-arm64.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: face-local-linux-arm64-${{ needs.prepare.outputs.tag }}
          path: release

      - name: Fallback download Linux ARM64 artifact from private repo
        if: ${{ needs.build-linux-arm64.result == 'success' && steps.download_linux_arm64.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_ARTIFACT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          if ! command -v gh >/dev/null 2>&1; then
            echo "gh CLI not found. Install GitHub CLI on this runner for artifact fallback downloads." >&2
            exit 1
          fi
          gh release download "artifact-release-${{ needs.prepare.outputs.package_version }}" \
            --repo "${{ env.ARTIFACT_REPO }}" \
            --pattern "Face-Local-linux-arm64-*-${{ needs.prepare.outputs.package_version }}.*" \
            --dir release

      - name: Download Linux x64 artifact
        id: download_linux_x64
        if: ${{ needs.build-linux-x64.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: face-local-linux-x64-${{ needs.prepare.outputs.tag }}
          path: release

      - name: Fallback download Linux x64 artifact from private repo
        if: ${{ needs.build-linux-x64.result == 'success' && steps.download_linux_x64.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_ARTIFACT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          if ! command -v gh >/dev/null 2>&1; then
            echo "gh CLI not found. Install GitHub CLI on this runner for artifact fallback downloads." >&2
            exit 1
          fi
          gh release download "artifact-release-${{ needs.prepare.outputs.package_version }}" \
            --repo "${{ env.ARTIFACT_REPO }}" \
            --pattern "Face-Local-linux-x64-*-${{ needs.prepare.outputs.package_version }}.*" \
            --dir release

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.package_version }}"
          missing=0

          require_file() {
            local path="$1"
            if [ ! -f "$path" ]; then
              echo "Required artifact not found: $path" >&2
              missing=1
            fi
          }

          if [ "${{ needs.build-macos.result }}" = "success" ]; then
            require_file "release/Face-Local-macOS-installer-${version}.dmg"
          fi
          if [ "${{ needs.build-windows.result }}" = "success" ]; then
            require_file "release/Face-Local-windows-portable-${version}.zip"
            if [ ! -f "release/Face-Local-windows-installer-${version}.exe" ]; then
              echo "::warning::Windows installer is missing; publishing portable zip only."
            fi
          fi
          if [ "${{ needs.build-linux-arm64.result }}" = "success" ]; then
            require_file "release/Face-Local-linux-arm64-installer-${version}.deb"
            require_file "release/Face-Local-linux-arm64-portable-${version}.tar.gz"
          fi
          if [ "${{ needs.build-linux-x64.result }}" = "success" ]; then
            require_file "release/Face-Local-linux-x64-installer-${version}.deb"
            require_file "release/Face-Local-linux-x64-portable-${version}.tar.gz"
          fi

          if [ "$missing" -ne 0 ]; then
            ls -la release || true
            exit 1
          fi

      - name: Upload assets to GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 scripts/github_release.py upload \
            --repo "$GITHUB_REPOSITORY" \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --name "${{ needs.prepare.outputs.release_name }}" \
            "release/*.dmg" \
            "release/*.zip" \
            "release/*.exe" \
            "release/*.deb" \
            "release/*.tar.gz"

      - name: Update GitHub release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          notes=$'Automated cross-platform build from `main`.\n\n'
          notes+="- Commit: ${GITHUB_SHA}"$'\n'
          notes+="- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"$'\n'
          notes+="- macOS runner: ${{ needs.pick-runner.outputs.mac_runner_note }}"$'\n'
          notes+="- Windows runner: ${{ needs.pick-runner.outputs.windows_runner_note }}"$'\n'
          notes+="- macOS build: ${{ needs.build-macos.result }}"$'\n'
          notes+="- Windows build: ${{ needs.build-windows.result }}"$'\n'
          notes+="- Linux ARM64 build: ${{ needs.build-linux-arm64.result }}"$'\n'
          notes+="- Linux x64 build on GitHub runner: ${{ needs.build-linux-x64.result }}"$'\n'
          python3 scripts/github_release.py update-notes \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --name "$RELEASE_NAME" \
            --notes "$notes"

  post-to-buffer:
    if: ${{ needs.release.result == 'success' && github.event_name == 'push' && github.run_attempt == 1 }}
    needs:
      - prepare
      - build-macos
      - build-windows
      - build-linux-arm64
      - build-linux-x64
      - release
    runs-on:
      - self-hosted
      - Linux
      - ARM64
    steps:
      - uses: actions/checkout@v6

      - name: Post release announcement via Buffer
        continue-on-error: true
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_CHANNEL_NAME: ${{ secrets.BUFFER_CHANNEL_NAME }}
          BUFFER_CHANNEL_SERVICE: ${{ secrets.BUFFER_CHANNEL_SERVICE }}
          BUFFER_POST_MODE: ${{ secrets.BUFFER_POST_MODE }}
          BUFFER_POST_TEMPLATE: ${{ secrets.BUFFER_POST_TEMPLATE }}
        shell: bash
        run: |
          python3 scripts/post_buffer_release.py \
            --app-name "$APP_NAME" \
            --tag "$RELEASE_TAG" \
            --release-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" \
            --platform "macOS=${{ needs.build-macos.result }}" \
            --platform "Windows=${{ needs.build-windows.result }}" \
            --platform "Linux ARM64=${{ needs.build-linux-arm64.result }}" \
            --platform "Linux x64=${{ needs.build-linux-x64.result }}"
