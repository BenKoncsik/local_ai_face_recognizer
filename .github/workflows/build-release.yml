  release:
    if: >-
      ${{
        always() &&
        (
          needs.build-macos.result == 'success' ||
          needs.build-windows.result == 'success' ||
          needs.build-linux-arm64.result == 'success' ||
          needs.build-linux-x64.result == 'success'
        )
      }}
    needs:
      - prepare
      - pick-runner
      - build-macos
      - build-windows
      - build-linux-arm64
      - build-linux-x64
    runs-on:
      - self-hosted
      - Linux
      - ARM64
    steps:
      - uses: actions/checkout@v6
        with:
          # Fine-grained PAT needed to bypass branch protection for appcast.xml commit
          token: ${{ secrets.APPCAST_PUSH_TOKEN }}

      - name: Download release artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRIVATE_ARTIFACT_TOKEN: ${{ secrets.PRIVATE_ARTIFACT_TOKEN }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          BUILD_MACOS_RESULT: ${{ needs.build-macos.result }}
          BUILD_WINDOWS_RESULT: ${{ needs.build-windows.result }}
          BUILD_LINUX_ARM64_RESULT: ${{ needs.build-linux-arm64.result }}
          BUILD_LINUX_X64_RESULT: ${{ needs.build-linux-x64.result }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          python3 - <<'PY'
          import concurrent.futures
          import fnmatch
          import io
          import json
          import os
          import sys
          import urllib.request
          import zipfile
          from pathlib import Path

          release_dir = Path("release")
          release_dir.mkdir(exist_ok=True)

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          github_token = os.environ["GITHUB_TOKEN"]
          private_token = os.environ.get("PRIVATE_ARTIFACT_TOKEN", "")
          artifact_repo = os.environ["ARTIFACT_REPO"]
          package_version = os.environ["PACKAGE_VERSION"]
          release_tag = os.environ["RELEASE_TAG"]
          fallback_tag = f"artifact-release-{package_version}"

          def request_json(url, token):
            req = urllib.request.Request(
              url,
              headers={
                "Accept": "application/vnd.github+json",
                "Authorization": f"Bearer {token}",
                "X-GitHub-Api-Version": "2022-11-28",
              },
            )
            with urllib.request.urlopen(req, timeout=120) as response:
              return json.load(response)

          def download_bytes(url, token, accept="application/octet-stream"):
            req = urllib.request.Request(
              url,
              headers={
                "Accept": accept,
                "Authorization": f"Bearer {token}",
                "X-GitHub-Api-Version": "2022-11-28",
              },
            )
            with urllib.request.urlopen(req, timeout=600) as response:
              return response.read()

          def download_workflow_artifact(name):
            print(f"Downloading workflow artifact: {name}", flush=True)
            url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100"
            artifacts = request_json(url, github_token).get("artifacts", [])
            artifact = next((item for item in artifacts if item.get("name") == name), None)
            if artifact is None:
              raise RuntimeError(f"workflow artifact not found: {name}")

            archive = download_bytes(artifact["archive_download_url"], github_token)
            with zipfile.ZipFile(io.BytesIO(archive)) as zf:
              zf.extractall(release_dir)
            print(f"{name}: workflow artifact downloaded", flush=True)

          def list_release_assets():
            if not private_token:
              raise RuntimeError("PRIVATE_ARTIFACT_TOKEN is empty; cannot use private artifact fallback")

            release = request_json(
              f"https://api.github.com/repos/{artifact_repo}/releases/tags/{fallback_tag}",
              private_token,
            )
            return release.get("assets", [])

          def fallback_release_download(pattern, required=True):
            assets = list_release_assets()
            matches = [asset for asset in assets if fnmatch.fnmatch(asset.get("name", ""), pattern)]
            if not matches and required:
              raise RuntimeError(f"fallback release asset not found: {pattern}")
            if not matches:
              print(f"Optional fallback asset not found: {pattern}", flush=True)
              return

            for asset in matches:
              data = download_bytes(asset["url"], private_token)
              target = release_dir / asset["name"]
              target.write_bytes(data)
              print(f"Downloaded fallback asset: {asset['name']}", flush=True)

          def download_platform(label, artifact_name, required_patterns, optional_patterns=()):
            try:
              download_workflow_artifact(artifact_name)
              return
            except Exception as exc:
              print(f"{label}: workflow artifact download failed: {exc}", flush=True)
              print(f"{label}: trying private artifact repo fallback", flush=True)

            for pattern in required_patterns:
              fallback_release_download(pattern, required=True)
            for pattern in optional_patterns:
              fallback_release_download(pattern, required=False)

          platforms = []
          if os.environ["BUILD_MACOS_RESULT"] == "success":
            platforms.append((
              "macOS",
              f"face-local-macos-{release_tag}",
              [f"Face-Local-macOS-installer-{package_version}.dmg"],
              [f"Face-Local-macOS-sparkle-{package_version}.zip", "sparkle_meta.json"],
            ))
          if os.environ["BUILD_WINDOWS_RESULT"] == "success":
            platforms.append((
              "Windows",
              f"face-local-windows-{release_tag}",
              [f"Face-Local-windows-*-{package_version}.*"],
              [],
            ))
          if os.environ["BUILD_LINUX_ARM64_RESULT"] == "success":
            platforms.append((
              "Linux ARM64",
              f"face-local-linux-arm64-{release_tag}",
              [f"Face-Local-linux-arm64-*-{package_version}.*"],
              [],
            ))
          if os.environ["BUILD_LINUX_X64_RESULT"] == "success":
            platforms.append((
              "Linux x64",
              f"face-local-linux-x64-{release_tag}",
              [f"Face-Local-linux-x64-*-{package_version}.*"],
              [],
            ))

          failures = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=max(1, len(platforms))) as executor:
            future_to_label = {
              executor.submit(download_platform, label, artifact_name, required, optional): label
              for label, artifact_name, required, optional in platforms
            }
            for future in concurrent.futures.as_completed(future_to_label):
              label = future_to_label[future]
              try:
                future.result()
              except Exception as exc:
                failures.append(f"{label}: {exc}")

          if failures:
            for failure in failures:
              print(failure, file=sys.stderr)
            raise SystemExit(1)
          PY

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.package_version }}"
          missing=0

          require_file() {
            local path="$1"
            if [ ! -f "$path" ]; then
              echo "Required artifact not found: $path" >&2
              missing=1
            fi
          }

          if [ "${{ needs.build-macos.result }}" = "success" ]; then
            require_file "release/Face-Local-macOS-installer-${version}.dmg"
          fi
          if [ "${{ needs.build-windows.result }}" = "success" ]; then
            require_file "release/Face-Local-windows-installer-${version}.exe"
          fi
          if [ "${{ needs.build-linux-arm64.result }}" = "success" ]; then
            require_file "release/Face-Local-linux-arm64-installer-${version}.deb"
            require_file "release/Face-Local-linux-arm64-portable-${version}.tar.gz"
          fi
          if [ "${{ needs.build-linux-x64.result }}" = "success" ]; then
            require_file "release/Face-Local-linux-x64-installer-${version}.deb"
            require_file "release/Face-Local-linux-x64-portable-${version}.tar.gz"
          fi

          if [ "$missing" -ne 0 ]; then
            ls -la release || true
            exit 1
          fi

      # ──────────────────────────────────────────────────────────────────────
      # Generate and publish appcast.xml (stable URL for Sparkle)
      # ──────────────────────────────────────────────────────────────────────

      - name: Generate appcast.xml
        if: ${{ needs.build-macos.result == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.package_version }}"
          TAG="${{ needs.prepare.outputs.tag }}"
          ZIP="release/Face-Local-macOS-sparkle-${VERSION}.zip"
          META="release/sparkle_meta.json"

          if [ ! -f "$ZIP" ]; then
            echo "Sparkle ZIP not found at $ZIP — skipping appcast generation"
            exit 0
          fi

          EDDSA_SIG=""
          if [ -f "$META" ]; then
            EDDSA_SIG="$(python3 -c "import json; print(json.load(open('$META'))['eddsa_signature'])")"
          fi

          if [ -z "$EDDSA_SIG" ]; then
            echo "::warning::EdDSA signature is empty — appcast will be unsigned"
            EDDSA_SIG="UNSIGNED"
          fi

          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/Face-Local-macOS-sparkle-${VERSION}.zip"
          NOTES_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"

          python3 scripts/generate_appcast.py \
            --version "$VERSION" \
            --build   "$VERSION" \
            --zip     "$ZIP" \
            --signature "$EDDSA_SIG" \
            --download-url     "$DOWNLOAD_URL" \
            --release-notes-url "$NOTES_URL" \
            --output docs/appcast.xml

          echo "=== Generated docs/appcast.xml ==="
          cat docs/appcast.xml

      - name: Commit and push appcast.xml
        if: ${{ needs.build-macos.result == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f docs/appcast.xml ]; then
            echo "appcast.xml not generated — skipping commit"
            exit 0
          fi
          # Skip if still a placeholder (no <item> element means no real release)
          if ! grep -q "<item>" docs/appcast.xml; then
            echo "appcast.xml contains no release item — skipping commit"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/appcast.xml
          if git diff --cached --quiet; then
            echo "appcast.xml unchanged — no commit needed"
            exit 0
          fi

          git commit -m "chore: update appcast.xml for ${{ needs.prepare.outputs.tag }} [skip ci]"
          git push origin HEAD:main

      - name: Upload assets to GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 scripts/github_release.py upload \
            --repo "$GITHUB_REPOSITORY" \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --name "${{ needs.prepare.outputs.release_name }}" \
            "release/*.dmg" \
            "release/*.zip" \
            "release/*.exe" \
            "release/*.deb" \
            "release/*.tar.gz"

      - name: Update GitHub release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          git fetch --tags --force --unshallow || git fetch --tags --force
          notes="$(python3 scripts/github_release.py build-notes \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --runner-note "macOS runner: ${{ needs.pick-runner.outputs.mac_runner_note }}" \
            --runner-note "Windows runner: ${{ needs.pick-runner.outputs.windows_runner_note }}" \
            --build-result "macOS build: ${{ needs.build-macos.result }}" \
            --build-result "Windows build: ${{ needs.build-windows.result }}" \
            --build-result "Linux ARM64 build: ${{ needs.build-linux-arm64.result }}" \
            --build-result "Linux x64 build on GitHub runner: ${{ needs.build-linux-x64.result }}")"
          python3 scripts/github_release.py update-notes \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --name "$RELEASE_NAME" \
            --notes "$notes"

      - name: Advance project issue statuses
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.APPCAST_PUSH_TOKEN }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          PROJECT_TITLE: Local AI Face Recognizer
          PROJECT_STATUS_FIELD: Status
          PROJECT_ISSUE_MOVE_BEST_EFFORT: "true"
        shell: bash
        run: |
          PROJECT_SOURCE_OPTION="In review" PROJECT_TARGET_OPTION="Done" python3 .github/scripts/move_project_issues_ready.py || true
          PROJECT_TARGET_OPTION="In review" python3 .github/scripts/move_project_issues_ready.py || true

  post-to-buffer:
    if: ${{ needs.release.result == 'success' && github.event_name == 'push' && github.run_attempt == 1 }}
    needs:
      - prepare
      - build-macos
      - build-windows
      - build-linux-arm64
      - build-linux-x64
      - release
    runs-on:
      - self-hosted
      - Linux
      - ARM64
    steps:
      - uses: actions/checkout@v6

      - name: Post release announcement via Buffer
        continue-on-error: true
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_CHANNEL_NAME: ${{ secrets.BUFFER_CHANNEL_NAME }}
          BUFFER_CHANNEL_SERVICE: ${{ secrets.BUFFER_CHANNEL_SERVICE }}
          BUFFER_POST_MODE: ${{ secrets.BUFFER_POST_MODE }}
          BUFFER_POST_TEMPLATE: ${{ secrets.BUFFER_POST_TEMPLATE }}
        shell: bash
        run: |
          python3 scripts/post_buffer_release.py \
            --app-name "$APP_NAME" \
            --tag "$RELEASE_TAG" \
            --release-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" \
            --platform "macOS=${{ needs.build-macos.result }}" \
            --platform "Windows=${{ needs.build-windows.result }}" \
            --platform "Linux ARM64=${{ needs.build-linux-arm64.result }}" \
            --platform "Linux x64=${{ needs.build-linux-x64.result }}"
