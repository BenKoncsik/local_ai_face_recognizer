detection:
  confidence_threshold: 0.65
  min_face_size: 50
  coral_model_path: models/ssd_mobilenet_v2_face_quant_postprocess_edgetpu.tflite
  cpu_model_path: models/res10_300x300_ssd_iter_140000.caffemodel
  verification_verify_all: true
embedding:
  model_path: models/mobilefacenet.tflite
  input_size:
  - 112
  - 112
  embedding_dim: 192
  backend: arcface
clustering:
  epsilon: 0.4
  min_samples: 2
  metric: cosine
storage:
  db_path: I:\local\face_local_project_2026_06_17\database\faces.db
  crops_dir: data/crops
scan:
  image_extensions:
  - .jpg
  - .jpeg
  - .png
  - .webp
  worker_threads: 2
  thumbnail_size:
  - 128
  - 128
deep_recognition:
  hidden_layers:
  - 256
  - 192
  - 128
  - 64
  - 48
  - 32
