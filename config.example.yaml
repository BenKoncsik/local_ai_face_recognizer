# Face-Local configuration example
# Copy to config.yaml and adjust to your environment.
# All paths are relative to the working directory unless absolute.

# Base directory for resolving relative paths.
# Defaults to the directory from which you run the application.
# base_dir: /home/user/face-local

detection:
  # Minimum confidence score [0.0 – 1.0] to accept a detection
  confidence_threshold: 0.65

  # Minimum face size in pixels (width and height must both exceed this)
  min_face_size: 50

  # Path to the Edge TPU compiled TFLite face detection model.
  # Comment out or remove to force CPU-only mode.
  #
  # How to obtain the model:
  #   1. Download from Coral model zoo:
  #      wget https://raw.githubusercontent.com/google-coral/test_data/master/\
  #           ssd_mobilenet_v2_face_quant_postprocess_edgetpu.tflite
  #   2. Place in models/ directory
  #   3. Set path below
  #
  # coral_model_path: models/ssd_mobilenet_v2_face_quant_postprocess_edgetpu.tflite

  # CPU DNN model path (Caffe SSD res10).
  # If omitted, the detector looks in models/ then falls back to Haar cascade.
  #
  # How to obtain:
  #   wget -P models/ https://raw.githubusercontent.com/opencv/opencv/master/\
  #        samples/dnn/face_detector/deploy.prototxt
  #   wget -P models/ https://raw.githubusercontent.com/opencv/opencv_3rdparty/\
  #        dnn_samples_face_detector_20170830/res10_300x300_ssd_iter_140000.caffemodel
  #
  # cpu_model_path: models/res10_300x300_ssd_iter_140000.caffemodel

  # YuNet ONNX detector. Returns 5 facial landmarks per face, which the
  # "aligned" embedding crop_mode needs. Preferred over the Caffe/Haar CPU
  # path when available (Coral, if configured, still takes priority).
  #
  # How to obtain:
  #   wget -P models/ https://github.com/opencv/opencv_zoo/raw/main/\
  #        models/face_detection_yunet/face_detection_yunet_2023mar.onnx
  #
  # use_yunet: true              # set false to force the Caffe/Haar path
  # yunet_model_path: models/face_detection_yunet_2023mar.onnx

  # Validate YuNet's 5 facial landmarks (eyes above nose above mouth, sane
  # inter-ocular distance, eye-line tilt <= 45°) to reject pareidolia such as
  # tree knots, hands, feet and card textures. Fails open and is a no-op for
  # landmark-less detectors (Coral / Caffe / Haar). Set false to disable.
  landmark_geometry_enabled: true

  # Crop-level re-detection gate (shared by the classic and AI paths). Each
  # uncertain detection is re-detected inside its own enlarged crop; a box that
  # cannot be re-confirmed there is dropped as a false positive.
  verification_enabled: true
  # confidence >= this trusts the detection and skips the gate (0..1).
  # verification_confidence_exempt: 0.80
  # Minimum re-detection score (inside the crop) required to keep a box.
  # verification_threshold: 0.55
  # Crop margin added on every side, as a fraction of the box (0.45 ≈ 1.9x).
  # verification_margin: 0.45
  # Upscale crops smaller than this many pixels before re-detecting.
  # verification_min_crop: 160

  # IoU threshold for "Find overlapping ? boxes" cleanup candidates.
  # A question-mark box is listed when it overlaps a real named face by at
  # least this much. Typical range: 0.30 - 0.40.
  duplicate_unknown_iou_threshold: 0.35

embedding:
  # NOTE: Embeddings run on CPU — Coral is NOT used for this step.
  # See app/embeddings/tflite_embedder.py for details.

  # Path to the MobileFaceNet TFLite embedding model.
  # If omitted, a HOG-based stub is used (low quality — for testing only).
  #
  # How to obtain a MobileFaceNet TFLite model:
  #   Option A — convert from ONNX:
  #     pip install onnx onnx-tf tensorflow
  #     # Download mobilefacenet.onnx from insightface model zoo
  #     # Convert to TFLite — see README for detailed steps
  #
  #   Option B — use a pre-converted model from the community:
  #     See README for verified download sources.
  #
  # model_path: models/mobilefacenet.tflite

  # Size (width, height) expected by the embedding model
  input_size: [112, 112]

  # Length of the output embedding vector (MobileFaceNet = 192, ArcFace = 512)
  embedding_dim: 192

  # How face crops are extracted before embedding:
  #   legacy  — bbox + margin stretched to a square (original; distorts boxes)
  #   square  — aspect-preserving square crop (no landmarks needed)
  #   aligned — 5-point ArcFace alignment (needs landmarks from YuNet; falls
  #             back to "square" when landmarks are unavailable)
  # WARNING: changing this changes every embedding. Re-detect + re-embed the
  # whole library afterwards, otherwise old and new embeddings are not comparable.
  # crop_mode: legacy

clustering:
  # Legacy DBSCAN grouping settings. The main pipeline now uses the learned
  # recognition settings below to assign unresolved faces to labeled people.
  # DBSCAN neighbourhood radius (cosine distance).
  # Lower → tighter clusters (more persons). Typical range: 0.3 – 0.6.
  epsilon: 0.4

  # Minimum faces per cluster core point.
  # Set to 1 to cluster every single face (produces many singletons).
  min_samples: 2

  # Distance metric for DBSCAN
  metric: cosine

recognition:
  # Embedding (vector) scoring settings shared across the app: the person-selector
  # match ordering, the reviewable Unknown auto-merge, the image-browser
  # "re-recognize faces" action and the face diagnostics view. Identity is
  # actually assigned by the AI (deep) engine; these only score/rank candidates.

  # Minimum combined cosine similarity [0.0 – 1.0] used as the scoring base.
  auto_assign_threshold: 0.72

  # Required gap between the best and second-best person match.
  # Higher → fewer ambiguous automatic assignments.
  min_margin: 0.08

  # Minimum trusted training faces before a person can be recognized.
  min_examples_per_person: 1

  # Blend between the person's centroid and nearest trusted example.
  # 1.0 = centroid only, 0.0 = nearest example only.
  centroid_weight: 0.70

  # Very confident automatic assignments can strengthen future profiles.
  use_recognized_faces_for_training: true
  profile_auto_min_confidence: 0.85

  # --- Pass 1: Adaptive threshold ---
  # Small / blurry / profile faces receive a lower threshold so they are not
  # unfairly excluded. The threshold is computed per face from its quality
  # score, bounding-box area, and aspect ratio.
  adaptive_threshold_enabled: true
  # Absolute floor — the threshold never drops below this value.
  adaptive_min_threshold: 0.55

  # --- Image-browser "re-recognize faces" workflow ---
  # Master switch for the user-triggered re-recognition of Unknown faces from
  # the image browser context menu. Can also be toggled in Settings → Face Quality.
  rerecognition_enabled: true
  # Score at/above which an Unknown face is auto-merged into the matched person
  # without asking (same cosine scale as auto_assign_threshold).
  rerecognition_auto_threshold: 0.72
  # Score at/above which a match is *suggested* for review. Below this nothing is
  # proposed. Must be < rerecognition_auto_threshold.
  rerecognition_suggest_threshold: 0.55

deep_recognition:
  # The new deep-learning recognition engine (Scan & Maintenance → AI tab).
  # A neural-network (MLP) ensemble is retrained from every trusted labeled
  # face on each run, with cross-validated per-person thresholds and open-set
  # rejection. Accuracy is preferred over speed: training may take minutes
  # and saturate every CPU core.
  enabled: true

  # Directory (relative to this file) where the trained model is persisted.
  model_dir: data/deep_model

  # --- Training ---
  # Independently seeded networks in the ensemble (more → steadier, slower).
  ensemble_size: 5
  # Hidden layer sizes of each member network (the output softmax layer —
  # the final inference — is added automatically on top of these).
  # Editable in Settings → AI Model.
  hidden_layers: [256, 192, 128, 64]
  # Maximum optimiser iterations per network.
  max_iter: 600
  # People with fewer faces are augmented (jitter + interpolation) up to this.
  min_class_size: 8
  augment_noise_sigma: 0.03
  # Cross-validation folds used to calibrate per-person thresholds.
  calibration_folds: 3
  # Skip retraining when the labeled data did not change since the last run.
  skip_unchanged: true
  # The neural-network ensemble only activates with at least this many labeled
  # people AND examples; below that the engine uses pure prototype matching
  # (a tiny discriminative network is overconfident and over-assigns).
  min_persons_for_ensemble: 4
  min_examples_for_ensemble: 30

  # --- Open-set / assignment gates ---
  # Fallback ensemble-probability threshold (per-person calibration may lower it).
  base_prob_threshold: 0.60
  # Hard floor for calibrated per-person thresholds.
  min_prob_threshold: 0.35
  # Required probability gap between the best and second-best person.
  min_margin: 0.10
  # Minimum cosine similarity to a real training example of the winner.
  # HARD floor: per-person calibration may only raise it, never lower it.
  min_prototype_similarity: 0.55
  # Required cosine-similarity gap between the winner and the most similar
  # training example of any OTHER person (ambiguous faces stay unknown).
  min_sim_margin: 0.05
  # Below this best-similarity to anyone known the face is an outlier
  # (stranger or non-face) and is never auto-assigned.
  outlier_similarity: 0.42

  # --- "Never recognise non-faces" ---
  # Boxes below this detector confidence are never auto-assigned.
  min_face_confidence: 0.60
  # Skip low-quality faces (blurry / tiny / sideways) during auto-assignment.
  strict_quality_filter: true

  # --- Continual learning from automatic assignments ---
  use_auto_assignments_for_training: true
  auto_training_min_confidence: 0.92

  # Use the slower high-accuracy detector pass in the AI pipeline.
  high_accuracy_detection: false

ai_face_detection:
  # AI (deep learning) face detection — analysis only. Part of the AI pipeline
  # and launchable from Scan & Maintenance → AI tab; it records whether an
  # image contains faces, how many, where (bounding boxes) and with what
  # confidence, using a pretrained YuNet ONNX detector. Results are stored in
  # the ai_face_detections table. It never assigns identities and never
  # modifies the classic detection/recognition results; if the model is
  # missing the rest of the app keeps working unaffected.
  enabled: true
  # Minimum detector confidence for a detection to be recorded. Matches the
  # classic path (0.65) so the AI pass is not more permissive — a lower value
  # is the single biggest driver of false positives (cards, hands, knots).
  confidence_threshold: 0.65
  # Minimum face bounding-box width AND height in pixels. 36 is a floor for
  # trustworthy landmark geometry while still surfacing genuinely small faces.
  min_face_size: 36
  # Optional explicit path to the YuNet .onnx model; null → the bundled
  # default (models/face_detection_yunet_2023mar.onnx).
  model_path: null
  # Also run this pass when the image browser's "re-recognize faces" action
  # is used (best-effort: an AI failure never breaks re-recognition).
  run_on_rerecognition: true
  # Re-run the crop-level YuNet verification gate (reusing the
  # detection.verification_* settings) to reject false positives that fire once
  # on the full image but cannot be re-confirmed in their own enlarged crop.
  verification_enabled: true

overlap_resolution:
  # Same-image overlapping-box cleanup in the AI pipeline. When the same
  # physical face carries several boxes, one survives: an assigned/manual box
  # always wins over an unknown one; between two unknown boxes the better one
  # is kept. Two different named persons are never touched.
  enabled: true
  # Boxes overlapping at or above this IoU count as the same face.
  iou_threshold: 0.35
  # A small box nested in a big one: intersection / smaller-box area.
  containment_threshold: 0.80
  # Required embedding similarity before deleting (protects close faces).
  embedding_guard_similarity: 0.80
  # Above this IoU the pair is resolved even when embeddings disagree.
  hard_iou_threshold: 0.65
  max_faces_per_image: 120

ignored_faces:
  # Permanent face ignore list ("Ignore Forever" on Unknown persons).
  # Faces matching a stored ignored embedding are suppressed in the pipeline
  # after recognition and before unknown clustering, so they never resurface
  # as new "Unknown N" persons after a re-scan.

  # Disable to keep the list but stop applying it.
  enabled: true

  # Minimum cosine similarity between a new face and an ignored embedding for
  # the new face to be suppressed. Deliberately stricter than the recognition
  # auto_assign_threshold (0.72) so genuinely new people are never swallowed.
  ignore_similarity: 0.80

suggestions:
  # Unknown-person name suggestions: compares auto-named ("Unknown N")
  # persons against the embedding profiles of manually-named persons.

  # Minimum cosine similarity [0.0 – 1.0] for a match to be suggested.
  # Below this value nothing is proposed. Higher → stricter.
  similarity_threshold: 0.5

  # Maximum number of ranked target candidates proposed per unknown person.
  max_suggestions_per_person: 3

storage:
  # SQLite database file path
  db_path: data/faces.db

  # Directory for face crop thumbnail JPEG files
  crops_dir: data/crops

scan:
  # Supported image file extensions (lowercase, including dot)
  image_extensions:
    - .jpg
    - .jpeg
    - .png
    - .webp

  # Number of parallel worker threads for the pipeline
  # (currently used for future parallelism; pipeline is serial in MVP)
  worker_threads: 2

  # Size (width, height) of saved face crop thumbnails
  thumbnail_size: [128, 128]

recording:
  # Built-in screen recorder (for documenting meetings / image walk-throughs).
  # Shells out to the system `ffmpeg` binary.  Most of these are also editable
  # in the UI under Settings → Recording (which persists to QSettings and
  # overrides the values here at runtime).

  # Default output folder.  null → ask on first recording, then remembered.
  output_dir: null

  # Capture frame rate (documentation quality; 15–20 recommended).
  fps: 18

  # Quality preset: low | normal | better  (lower = smaller file).
  quality: normal

  # Length of each on-disk segment in seconds.  Shorter = less data lost on a
  # crash, but more files to concatenate at the end.
  segment_seconds: 8

  # Draw the mouse cursor into the recording.
  capture_cursor: true

  # Record the microphone.
  capture_microphone: true

  # Best-effort system/speaker audio.  Requires a virtual loopback device
  # (macOS: BlackHole/Loopback, Windows: WASAPI loopback / "Stereo Mix" /
  # virtual-audio-capturer).  When no such device is found it is skipped, but
  # the reason is logged (see the [Audio] diagnostics) rather than silently.
  capture_system_audio: true

  # Explicit audio devices by name (null → auto-pick).  audio_input_device
  # selects the microphone; system_audio_device selects the loopback.
  audio_input_device: null
  system_audio_device: null

  # Per-source linear gain applied before mixing (1.0 = unity).  Both sources
  # are mixed into a single 48 kHz stereo AAC track with clipping protection.
  mic_volume: 1.0
  system_volume: 1.0

  # Drop a source from the mix without changing the device selection.
  mute_microphone: false
  mute_system_audio: false

  # Explicit ffmpeg path; null → resolve from PATH.
  ffmpeg_path: null

  # Concatenate the segments into a single recording.mp4 when stopping.
  concat_on_stop: true
