[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face-local"
version = "1.0.0"
description = "Offline face grouping and person labeling with Coral Edge TPU support"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.24,<2.0",
    "opencv-python>=4.8",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "PySide6>=6.6,<6.11",
    "SQLAlchemy>=2.0",
    "scikit-learn>=1.3",
    "openpyxl>=3.1",
    # TFLite runtime: primary embedding backend.
    # Wheels available for Python 3.9-3.12 on Linux x64/ARM64, macOS, Windows x64.
    # Falls back to tflite_runtime or tensorflow if absent (see app/embeddings/tflite_embedder.py).
    "ai-edge-litert>=1.0",
]

[project.optional-dependencies]
tflite = [
    "ai-edge-litert>=1.0",
]
coral = [
    "pycoral>=2.0",
]
gdrive = [
    # Google Drive online work mode (online-only, ephemeral cache).
    # The cache layer in app/gdrive/cache.py works without these; only the
    # actual OAuth flow and Drive API client require them.
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-api-python-client>=2.0",
    "keyring>=24.0",
]
dev = [
    "pytest>=7.4",
    "pytest-qt>=4.2",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
face-local = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
